# Air formatter configuration for tabxplor.
# Docs: https://posit-dev.github.io/air/configuration.html
# Unset keys use defaults: line-width = 80, indent-width = 2 (spaces),
# assignment-style = "arrow", persistent-line-breaks = true.

[format]
# jmvtab.h.R is auto-generated by jamovi (do not edit) — keep Air off it so it
# never fights the generator. jmvtab.b.R is hand-written and stays formatted.
exclude = ["R/jmvtab.h.R"]
