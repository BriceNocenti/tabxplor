# _pkgdown.fr.yml -- French build of the tabxplor pkgdown site (Last Phase w).
# Built into docs/fr/ by dev/build_site_bilingual.R, alongside the English site at docs/.
# `lang: fr` localises pkgdown's own UI (search box, "Source", "On this page"...). The FUNCTION
# reference PAGES stay English (R has no bilingual .Rd; see the roadmap: help-page translation was
# declined). The French ARTICLES (translated vignettes) land with the deferred vignette phase and slot
# into `articles:` below -- until then this site's narrative content is English.

url: https://bricenocenti.github.io/tabxplor/fr/
destination: docs/fr

template:
  bootstrap: 5
  lang: fr

navbar:
  structure:
    right: [lang, search, github]
  components:
    lang:
      text: EN
      href: ../index.html

# La référence est ordonnée par priorité : d'abord les deux fonctions phares, puis tout ce dont un
# utilisateur ordinaire a besoin, puis (nettement séparées) les fonctions pour programmer avec tabxplor.
# Les méthodes S3 et les fonctions internes portent `@keywords internal`, donc pkgdown les exclut
# entièrement de l'index : l'utilisateur appelle les génériques (`get_type()`, `mutate()`, …), jamais
# les méthodes à point.
reference:

# ===================================  Usage courant  ===================================

- title: Les deux fonctions principales
  desc: >
    Commencez ici. `tab()` construit un tableau croisé coloré ; `tab_reg()` un tableau de régression
    qui se présente et se comporte comme un tableau croisé.
  contents:
  - tab
  - tab_reg

- title: Variantes de tab()
  desc: La même idée que `tab()`, pour une entrée particulière.
  contents:
  - tab_num
  - tab_counts

- title: Raccourcis de régression et graphiques
  desc: >
    `tab_logit()` et `multi_logit()` sont de simples enrobages autour de `tab_reg()` pour les modèles
    logistiques. `or_plot()` et `lm_plots()` tracent des graphiques à partir d'un tableau de régression.
  contents:
  - tab_logit
  - multi_logit
  - or_plot
  - lm_plots

- title: Exporter un tableau terminé
  desc: >
    `tab_export()` est la seule fonction dont la plupart des utilisateurs ont besoin. `tab_html()`,
    `tab_md()`, `tab_xl()` et `tab_plot()` sont les exportateurs par format qu'elle enrobe
    (`tab_kable()` est un alias de `tab_html()`) ; `tab_css()` / `tab_md_css()` produisent la feuille
    de style des couleurs pour tout un document.
  contents:
  - tab_export
  - tab_html
  - tab_md
  - tab_xl
  - tab_plot
  - tab_css
  - tab_md_css

- title: Titres, options et données
  desc: >
    Les échelles de couleur et les palettes se personnalisent avec `set_color_breaks()`,
    `set_color_palette()` et `set_color_style()` (documentés sur la page `tab_many()`).
  contents:
  - set_caption
  - tabxplor-options
  - gss_cat_data_formatting

- title: Interface graphique (jamovi)
  contents:
  - jmvtab
  - jmvtabreg

# ==============================  Programmer avec tabxplor  ==============================
# Pour écrire vos propres fonctions et pipelines. L'usage courant n'a jamais besoin de ce qui suit.

- title: Le moteur, remodeler et combiner
  desc: >
    `tab_many()` est le moteur vectorisé derrière `tab()` (et l'endroit où sont documentées les aides
    aux couleurs `set_color_breaks()` / `set_color_palette()` / `set_color_style()`). Le reste remodèle
    et combine des tableaux terminés.
  contents:
  - tab_many
  - tab_spread
  - tab_compact
  - tab_transpose
  - complete_partial_totals

- title: Le type de cellule fmt
  desc: L'enregistrement vctrs `tabxplor_fmt` derrière chaque case numérique, et ses constructeurs.
  contents:
  - fmt
  - new_tab
  - fmt_get_color_code

- title: Le pipeline étape par étape (remplacé)
  desc: >
    Les étapes individuelles que `tab_many()` fusionne désormais. Chacune reste exportée et utilisable
    seule, mais `tab()` / `tab_num()` les remplacent.
  contents:
  - tab_plain
  - tab_prepare
  - tab_pct
  - tab_tot
  - tab_totaltab
  - tab_ci
  - tab_chi2

- title: Préparation des données et aides à la mise en page
  desc: Petits utilitaires pour préparer les données ou mettre en page un tableau.
  contents:
  - score_from_lv1
  - fct_recode_helper
  - tab_wrap_text
  - tab_get_wrapped_dimensions
  - tab_parallel_stop
  - kable_tabxplor_style

# Articles français : les vignettes traduites vivent dans vignettes/articles/ (.Rbuildignore'ées,
# donc hors CRAN, présentes seulement sur le site). Elles rendent leurs tableaux avec les légendes
# françaises via options(tabxplor.lang = "fr") dans leur chunk setup. pkgdown construit tous les
# articles dans les deux arbres et un index incomplet est une erreur bloquante, donc les six sont
# listés ; les vignettes anglaises passent dans un groupe secondaire "In English".
articles:
- title: Pour commencer
  navbar: ~
  contents:
  - articles/tabxplor-fr
  - articles/tabxplor-reg-fr
  - articles/tabxplor-programming-fr
- title: In English
  navbar: English
  contents:
  - tabxplor
  - tabxplor-reg
  - tabxplor-programming
