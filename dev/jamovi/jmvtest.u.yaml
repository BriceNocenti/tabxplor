title: Export folder test
name: jmvtest
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtest::update
children:
  - type: CollapseBox
    label: <b>Export folder diagnostics</b>
    stretchFactor: 1
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: test_name
            format: string
            width: largest
          - type: TextBox
            name: test_dir
            format: string
            width: largest
          - type: LayoutBox
            margin: none
            children:
              - type: ActionButton
                name: write_detected
                label: Write test file to detected Documents
                events:
                  change: ./jmvtest::write_detected_changed
          - type: LayoutBox
            margin: none
            children:
              - type: ActionButton
                name: write_all
                label: Write a test file to every candidate
                events:
                  change: ./jmvtest::write_all_changed
