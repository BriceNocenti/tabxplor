---
name:  jmvtabreg
title: Regression models
jrs:   '1.1'

items:

    - name: html_table
      title: Table
      type: Html

    # Hidden state carrier for the live fit cache. Only Image elements persist a `$state` across the
    # engine reset, so this 0-size Image hosts the (gzip-RDS'd) store of fit digests / raw fits. It
    # renders nothing (.plot returns TRUE); `.run()` reads/writes self$results$cache_state$state.
    - name: cache_state
      title: ""
      type: Image
      width: 1080
      height: 1
      renderFun: .plot
      visible: false

    # Phase h: persists the last COMPUTED comparison (signature + rendered HTML) across engine resets,
    # so that in staged model-comparison mode `.run()` can re-serve the last table (or flag it outdated)
    # without recomputing until the Run button is clicked. Same 0-size hidden-Image mechanism.
    # ⚠ `visible: false` IS LOAD-BEARING, and it is why this differs from a plain results image.
    # jmvcore's Image$asProtoBuf() reports an image that HOLDS A STATE and has rendered no file as
    # ANALYSIS_RENDERING -- and `.plot` writes no file, by design. Left visible, the client then asks
    # for a render, and that round-trip overwrote the run's own results: the comparison appeared and
    # was replaced a moment later by the "staged" banner. State itself is serialized in
    # ResultsElement$asProtoBuf() INDEPENDENTLY of `visible`, so hiding it costs nothing.
    - name: compare_state
      title: ""
      type: Image
      width: 1080
      height: 1
      renderFun: .plot
      visible: false
...
