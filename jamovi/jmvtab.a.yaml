---
name:  jmvtab
title: Crosstables
menuGroup: tabxplor
version: '1.0.0'
jas: '1.2'
weightsSupport: 'full'
# description:
#     R: >
#      Use `tab_many()` in `Jamovi` with an user interface ; useful to learn
#      programming with `tabxplor`.

options:
    - name: data
      type: Data
      description:
          R: >
           A data.frame.

    - name: row_vars
      title: "<b>row_vars = <i>(row variables)</i></b>"
      type: Variables
      permitted: [numeric, factor]
      default: NULL
      suggested:
        - nominal
        - ordinal
      description:
          R: >
            The row variable, which will be printed with one level per line.
            If numeric, it will be converted to factor. If several row variables
            are provided, it's not possible to add any tab_vars.

    - name: col_vars
      title: "<b>col_vars = <i>(column variables)</i></b>"
      type: Variables
      suggested:
        - nominal
        - ordinal
        - continuous
      permitted: [numeric, factor]
      default: NULL
      description:
          R: >
           One column is printed for each level of each column variable.
           For numeric variables means are calculated, in a single column.

    - name: tab_vars
      title: "<b>tab_vars = <i>(subtables variables)</i></b>"
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted: [factor]
      default: NULL
      description:
          R: >
           One subtable is made for each combination of levels of the tab variables.
           All tab variables are converted to factor. Leave empty to make a simple table.
           Not used when there are several row_vars.

    - name: wt
      title: "<b>wt = <i>(weights)</i></b>"
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description:
          R: >
           A weight variable, of class numeric. Leave empty for unweighted results.

# Percentages, colors and Chi2
    - name: pct
      title: pct
      type: List
      options:
        - title: "no (counts)"
          name:  "no"
        - title: row
          name:  row
        - title: "col (column)"
          name:  col
        - title: all
          name:  all
        - title: all_tabs
          name:  all_tabs
      default: "no"
      description:
          R: >
           The type of percentages to calculate :
            \itemize{
              \item \code{"row"}: row percentages.
              \item \code{"col"}: column percentages.
              \item \code{"all"}: frequencies for each subtable/group, if there is \code{tab_vars}.
              \item \code{"all_tabs"}: frequencies for the whole (set of) table(s).
            }

    - name: color
      title: color
      type: List
      options:
        - title: "no <i>(no colors)</i>"
          name:  "no"
        - title: "auto <i>(smart default: difference + ratio)</i>"
          name:  auto
        - title: "difference <i>(from the total, or the reference cell)</i>"
          name:  difference
        - title: "ratio <i>(relative risk, or mean ratio)</i>"
          name:  ratio
        - title: "odds_ratio <i>(odds ratios)</i>"
          name:  odds_ratio
        - title: "contrib <i>(contribution to variance)</i>"
          name:  contrib
      default: "no"
      description:
          R: >
           Which measure to use for color helpers, as a single string. The values are the measure
            names \code{tab()} itself takes (the short spellings \code{"diff"} / \code{"OR"} stay
            valid aliases in R).
            \itemize{
              \item \code{"no"}: by default, no colors are printed.
              \item \code{"auto"}: a smart per-column-type default (percentage-point difference on
              the text plus a relative-risk highlight on the background for factors, mean ratio for
              numeric columns).
              \item \code{"difference"}: color the difference of each cell from its total (or
              reference cell). For factors this is a percentage-point difference; for numeric columns
              the standardized (SD-scaled) mean difference.
              \item \code{"ratio"}: color the relative risk (factors) or mean ratio (numeric).
              \item \code{"odds_ratio"}: for `pct == "col"` or `pct == "row"`, color based on odds
              ratios. To PRINT them, set \code{display} (the colour and the printed quantity are two
              questions).
              \item \code{"contrib"}: color cells based on their contribution to variance
              (factor columns only).
            }
           How significance gates these colors is set separately by \code{color_signif}.

    - name: color_signif
      title: color_signif
      type: List
      options:
        - title: "ignore <i>(color deviations by observed size)</i>"
          name:  ignore
        - title: "grey_non_signif <i>(same + uncolor non-significant)</i>"
        #####    "guaranteed_effect <i>(only the CI-guaranteed effect)</i>"
          name:  grey_non_signif
        - title: "guaranteed_effect <i>(color all CI-floor/small sample)</i>"
          name:  guaranteed_effect
      default: ignore
      description:
          R: >
           How statistical significance gates the colors, as a single string.
            \itemize{
              \item \code{"ignore"}: by default, color every deviation by its observed size.
              \item \code{"grey_non_signif"}: color by observed size, but grey out cells whose
              deviation is not significant (at \code{conf_level}). A confidence interval on the
              difference is computed automatically.
              \item \code{"guaranteed_effect"}: color by the guaranteed (confidence-bound) effect --
              all cells whose interval clears the threshold show, with dimmer colors.
            }

    - name: test
      title: "Add statistical test/effect size"
      type: Bool
      default: false
      description:
          R: >
           Set to \code{TRUE} to add a test p-value row: a Chi-square test for categorical column
           variables and an ANOVA F-test for numeric ones (chosen automatically per column type).
           Also enables colouring cells by their contribution to variance.

    - name: anova
      title: "ANOVA F (numeric)"
      type: List
      options:
        - title: "Welch <i>(unequal variances)</i>"
          name:  welch
        - title: "classic <i>(equal variances)</i>"
          name:  classic
      default: welch
      description:
          R: >
           Which F statistic to display for numeric column variables when the test is on:
           Welch's F (default, does not assume equal variances) or the classic pooled F.

    - name: design_effect
      title: design_effect
      type: Bool
      default: false
      description:
          R: >
           For a WEIGHTED table, make the confidence intervals, the significance stars, the colour
           thresholds AND the p-values account for the unequal weighting (the exact flat survey-design
           variance) instead of using the raw number of respondents. Sets
           options(tabxplor.design_effect). Off by default; it moves every interval in the table, not
           only the p-value.


# Missing values and levels
    - name: na
      title: na
      type: List
      options:
        - title: "keep <i>(NA as a normal level)</i>"
          name:  keep
        - title: "drop <i>(each col_var drops its own NA)</i>"
          name:  drop
        - title: "drop_all <i>(complete cases in all col_vars)</i>"
          name:  drop_all
        - title: "common_base <i>(complete cases of 1st col_var)</i>"
          name:  common_base
      default: keep
      description:
          R: >
           The policy to adopt with missing values. It must be a single string.
            \itemize{
              \item \code{na = "keep"}: by default, prints \code{NA}'s as explicit \code{"NA"} level.
              \item \code{na = "drop"}: each column variable drops its own \code{NA}'s, so tables
              made with different column variables may have a different number of observations.
              \item \code{na = "drop_all"}: drops every observation missing on the row variable,
              any column variable or a tab variable (all columns then share one base).
              \item \code{na = "common_base"}: fixes a single population (non-missing on the row
              variable and the first column variable), while secondary column variables keep their
              own \code{NA}'s. Reproduces the historical \code{tab()} behaviour.
              }

    # NB: the option is named `lvs`, NOT `levels`: `jmvcore::Options` already has a `levels()`
    # method, so a `levels` option collides ("symbol already has a regular binding"). The UI
    # label still reads "levels"; .b.R maps `lvs` onto tab()'s `levels` argument.
    - name: lvs
      title: levels
      type: List
      options:
        - title: all
          name:  all
        - title: "first <i>(first level of each col_var)</i>"
          name:  first
        - title: "auto <i>(first level if binary)</i>"
          name:  auto
      default: all
      description:
          R: >
           The levels of \code{col_vars} to keep.
            \itemize{
              \item \code{"all"}: by default, all levels are kept.
              \item \code{"first"}: only keep the first level of each \code{col_vars}
              \item \code{"auto"}: keep the first level when `col_var` is only two levels,
              keep all levels otherwise.
              }

    - name: other_if_less_than
      title: <b>other_if_less_than = <i>("Other" level)</i></b>
      type: Number
      min: 0
      default: 0
      description:
          R: >
           When set to a positive integer, levels with less count
           than that will be merged into an "Others" level.

    - name: cleannames
      title: "<b>cleannames =</b>"
      type: Bool
      default: true
      description:
          R: >
           By default, clean levels names, by removing
           prefix numbers like "1-", and text in parenthesis.
           Set to `FALSE` to avoid this behaviour.

# NOT offered as controls, deliberately: the four synthetic labels are one option in R since
# Phase 20b (`options(tabxplor.total_names)`) and the module installs the translated defaults for
# the duration of a build (jmv_tab3_build_armed); `tot` / `totcol` are always on in the panel.


# References (points of comparison)

    # Phase 7g-iii: per-variable reference picker, driven by the `refPickerCtrl` CustomControl in
    # .u.yaml (a Material list). One {var, ref} entry per picked variable -- keyed by row_var under
    # pct="row"/means, by col_var under pct="col" (the .b.R filters to the active axis). `ref` is a
    # String (a chosen level label, "tot" for the total, or "" for the auto default), read into a
    # named `ref` vector by jmvtab_ref_vector(). `hidden: true` -> the compiler generates no default
    # control (the CustomControl is the sole UI; edits the option via ui.ref_levels in js/jmvtab.js).
    - name: ref_levels
      title: "Reference levels (per variable)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: ref
                type: String

    # Phase 7g-ii: per-variable level-reordering picker. One {var, levels} entry per REORDERED
    # factor (row/col/tab); `levels` is the ordered level labels (element order = display order).
    # Un-reordered variables get no entry. Read into tab()'s internal `.levels_order` by
    # jmvtab_levels_order(); applied post-aggregate (tier-3) in jmv_cache_aggregate().
    # `hidden: true` -> the .u.yaml compiler does NOT auto-generate a default control for this option
    # (uicompiler insertMissingControls skips hidden options); the `levelsCtrl` CustomControl in
    # .u.yaml is the sole UI and edits this option via ui.levels_order in js/jmvtab.js.
    - name: levels_order
      title: "Level order (per variable)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: levels
                type: Array
                template:
                    type: String

    # Phase 20g-ii: the level-MERGE tick-boxes, written by the SAME control (levelsCtrl). One entry
    # per merged GROUP -- `var` repeats across a variable's groups, because a jamovi option template
    # cannot nest three deep. An empty `label` is filled in R (the joined level labels), so the text
    # box only ever shows that string as a placeholder. Folded by jmvtab_levels_collapse() into
    # tab()'s internal `.levels_collapse`, applied PRE-aggregate in tab_prepare(): it changes counts,
    # bases and the test, so it is a tier-1 cache miss by design (jmv_cache_aggregate names it).
    # `hidden: true` for levels_order's reason: a CustomControl never claims its option, so without
    # it the compiler auto-generates a second, broken default control.
    - name: levels_collapse
      title: "Merged levels (per variable)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: label
                type: String
              - name: levels
                type: Array
                template:
                    type: String

    # Phase 7g-iii: the reference picker (refPickerCtrl) replaced the visible `ref` text box; this
    # option is kept `hidden` as the expert free-text fallback / read target of jmvtab_ref_vector().
    - name: ref
      title: "auto/tot/<i>{row_number}</i>/<i>{row_name}</i>"
      type: String
      default: auto
      hidden: true
      description:
          R: >
           The reference cell to calculate differences and ratios
             (used to print \code{colors}) :
             \itemize{
              \item \code{"auto"}: by default, cell difference from the corresponding total
              (rows or cols depending on \code{pct = "row"} or \code{pct = "col"}) is
              used for `diff` ; cell ratio from the first line (or col) is use for `OR`
              (odds ratio/relative risks ratio).
              \item \code{"tot"}: totals are always used.
              \item \code{"first"}: calculate cell difference or ratio from the first cell
            of the row or column (useful to color temporal developments).
              \item \code{n}: when `ref` is an integer, the nth row (or column) is used for comparison.
              \item \code{"regex"}: when `ref` is a string, it it used as a regular expression,
              to match with the names of the rows (or columns). Be precise enough to match only one
              column or row, otherwise you get a warning message.
              \item \code{"no"}: not use ref and not calculate diffs to gain calculation time.
            }

    # Phase 7g-iii: `ref2` (the OR 2nd reference) is now driven by the refPickerCtrl ref2 section
    # (shown only when OR is active); `hidden` so the compiler generates no default text box.
    - name: ref2
      title: "first/tot/<i>{col_number}</i>"
      type: String
      default: first
      hidden: true
      description:
          R: >
           With `OR = OR` (odds-ratios) and a 3+ levels factor, a second reference cell 
           is needed to calculate relative risks ratios. First cell by default.

    - name: comp
      title: comp
      type: List
      options:
        - title: "tab <i>(compare in each subtable)</i>"
          name:  tab
        - title: "all <i>(compare with the total subtable)</i>"
          name:  all
      default: tab
      description:
          R: >
           The comparison level : by subtables/groups, or for the whole table.

# Confidence intervals
    - name: ci
      title: ci
      type: List
      options:
        - title: "auto"
          name:  auto
        - title: "no <i>(no confidence interval)</i>"
          name:  "no"
        - title: "cell <i>(each cell's own interval)</i>"
          name:  cell
        - title: "ref <i>(interval on the comparison with the reference)</i>"
          name:  ref
      default: auto
      description:
          R: >
           <b>What the confidence interval is anchored on</b> -- one question, four answers. The
            GEOMETRY of the interval is not asked here: it follows the comparison the table makes
            (set by \code{color} / \code{display}), so a difference table gets a difference
            interval and a ratio table a ratio one.
            \itemize{
             \item \code{"auto"}: build the comparison interval when something reads it
             (\code{stars}, or a \code{color_signif} policy), and none otherwise.
             \item \code{"no"}: no interval at all.
             \item \code{"cell"}: each cell's own interval (a percentage / a mean with its own
             bounds). It anchors nothing to compare, so \code{stars} and \code{color_signif} are
             informed and switched off.
             \item \code{"ref"}: the interval of the comparison with the reference cell -- what
             \code{stars} and \code{color_signif} read.
            }

    - name: conf_level
      title: ""
      type: Number
      min: 0
      max: 1
      default: 0.95
      description:
          R: >
           The confidence level, as a single numeric between 0 and 1.
           Default to 0.95 (95%).

    - name: ci_print
      title: "options('tabxplor.ci_print' = ...)"
      type: List
      options:
        - title: "ci <i>(interval display: [inf;sup])</i>"
          name:  ci
        - title: "moe <i>(display: pct±margin of error)</i>"
          name:  moe
      default: ci
      description:
          R: >
           By default confidence interval are printed with the interval display.
           Set to "moe" to use pct +- moe instead.

    - name: stars
      title: stars
      type: Bool
      default: false
      description:
          R: >
           With \code{ci = "diff"}, print significance stars (\code{*} \code{**} \code{***}) for
           the difference of each cell from its reference. Read from the same confidence interval
           that is displayed, so stars and bracket always agree.

    - name: ci_method_cell
      title: "ci_method = c(cell = )"
      type: List
      options:
        - title: "wilson <i>(score, default)</i>"
          name:  wilson
        - title: "wald <i>(normal approx.)</i>"
          name:  wald
        - title: "beta <i>(Clopper-Pearson exact)</i>"
          name:  beta
      default: wilson
      description:
          R: >
           The proportion confidence-interval method for \code{ci = "cell"}: \code{"wilson"}
           (the score interval, default) or \code{"wald"} (the normal approximation).

    - name: ci_method_diff
      title: "ci_method = c(diff = )"
      type: List
      options:
        - title: "newcombe <i>(hybrid score)</i>"
          name:  newcombe
        - title: "ac <i>(Agresti-Caffo)</i>"
          name:  ac
        - title: wald
          name:  wald
      default: newcombe
      description:
          R: >
           The proportion confidence-interval method for \code{ci = "diff"}. \code{"newcombe"}
           (default) is the dual of the two-proportion score test, so the interval and the
           significance stars always agree.

    - name: ci_method_mean_diff
      title: "ci_method = c(mean_diff = )"
      type: List
      options:
        - title: "welch <i>(unequal variances, default)</i>"
          name:  welch
        - title: "student <i>(pooled variance, the two groups)</i>"
          name:  student
        - title: "ols <i>(pooled over all levels, as a linear model)</i>"
          name:  ols
      default: welch
      description:
          R: >
           The confidence-interval method for the difference of numeric means
           (means with \code{ci = "diff"}): Welch (default), Student (the two groups pooled) or
           OLS (pooled over every level of the variable, i.e. the interval a linear model gives
           that coefficient).

    - name: ci_method_mean_ratio
      title: "ci_method = c(mean_ratio = )"
      type: List
      options:
        - title: "robust <i>(each group's variance, default)</i>"
          name:  robust
        - title: "quasipoisson <i>(dispersion-scaled)</i>"
          name:  quasipoisson
        - title: "poisson <i>(naive counts)</i>"
          name:  poisson
      default: robust
      description:
          R: >
           The confidence-interval method for a ratio of numeric means
           (means with \code{ci = "ratio"}).



# Other formatting
    - name: totaltab
      title: totaltab
      type: List
      options:
        - title: line
          name:  line
        - title: table
          name:  table
        - title: no
          name:  "no"
      default: line
      description:
          R: >
           The total table, if there are subtables/groups
             (i.e. when \code{tab_vars} is provided). Vectorised over `row_vars`.
            \itemize{
              \item \code{"line"}: by default, add a general total line (necessary for
              calculations with \code{comp = "all"})
              \item \code{"table"}: add a complete total table
             (i.e. \code{row_var} by \code{col_vars} without \code{tab_vars}).
              \item \code{"no"}: not to draw any total table.
             }

    - name: wrap_rows
      title: ""
      type: Number
      min: 0
      default: 35
      description:
          R: >
           By default, rownames are wrapped when larger than 30 characters.

    - name: wrap_cols
      title: ""
      type: Number
      min: 0
      default: 15
      description:
          R: >
           By default, colnames are wrapped when larger than 12 characters.

# ==================== Display and export ====================

    - name: display
      title: "" # Display
      type: List
      options:
        - title: "auto"
          name:  auto
        - title: "n <i>(unweighted counts)</i>"
          name:  "n"
        - title: "wn <i>(weighted counts)</i>"
          name:  wn
        - title: "pct <i>(percentages)</i>"
          name:  pct
        - title: "value with its confidence interval"
          name:  base_ci
        - title: "ci <i>(the interval alone)</i>"
          name:  ci
        - title: "diff <i>(difference from the reference)</i>"
          name:  diff
        - title: "ratio <i>(ratio to the reference)</i>"
          name:  ratio
        - title: "or <i>(odds ratios or relative risks ratios)</i>"
          name:  or
        - title: "odds ratio, percentage in bracket"
          name:  "{or} ({pct})"
        - title: "ctr <i>(relative contributions to variance)</i>"
          name:  ctr
        - title: "mean <i>(mean, for numeric variables)</i>"
          name:  mean
        - title: "var <i>(variance)</i>"
          name:  var
      default: auto
      description:
          R: >
           What each cell shows. Every value here is a \code{tab(display =)} value: a bare field
            name, a named layout such as \code{"base_ci"} (each value with its interval), or a
            \code{\{\}} template combining fields. \code{"auto"} keeps whatever the table was
            built with. A template naming a field the table does not carry renders empty and says
            which argument would fill it.

    - name: add_n
      title: "" #
      type: Bool
      default: true
      description:
          R: >
           For `pct = "row"` or `pct = "col"`, set to `FALSE` not to add another
           column or row with unweighted counts (`n`).

    - name: add_pct
      title: "" #
      type: Bool
      default: false
      description:
          R: >
           Set to `TRUE` to add a column with the frequencies of the row
           variable (for `pct = "row"`) or a row with the frequencies of the column variable
           (for  `pct = "col"`)

    - name: subtext
      title: "" # subtext
      type: String
      default: ""
      hidden: true      # driven by the subtextCtrl CustomControl (a full-width auto-grow textarea)
      description:
          R: >
           A character vector to print rows of legend under the table.

    - name: digits
      title: ""
      type: List
      options:
        - title: "0"
          name:  "0"
        - title: "1"
          name:  "1"
        - title: "2"
          name:  "2"
        - title: "3"
          name:  "3"
        - title: "4"
          name:  "4"
        - title: "5"
          name:  "5"
        - title: "6"
          name:  "6"
      default: "0"
      description:
          R: >
           The number of digits to print, as a single integer (0-6). In R, \code{tab()} also accepts
           an integer vector the same length as \code{col_vars}.

    - name: n_min
      title: <b>n_min = <i>(hide rows/cols with small n)</i></b>
      type: Integer
      min: 0
      default: 0
      description:
          R: >
           A pure display filter (0 = off). A row is dropped only when its largest base across the
           column variables is below \code{n_min}; surviving cells whose own base is below
           \code{n_min} are blanked. Under \code{pct = "col"} weak columns are dropped instead.
           Totals, the added-n row/column and the p-value line are always kept. Recomputes nothing.

    - name: export_format
      title: "Format"
      type: List
      options:
        - title: Excel
          name:  excel
        - title: HTML
          name:  html
        - title: Markdown
          name:  md
      default: excel
      description:
          R: >
           The export file format: Excel (`.xlsx`), HTML (`.html`) or Markdown (`.md`).

    - name: exportExcel
      title: "Export"
      type: Action
      description:
        R: "Press to export the table to the chosen format (the button label follows the format)."

    - name: export_dir
      type: String
      title: "Path:"
      default: "~/Documents"
      description:
          R: >
           The folder to save the exported file in. Blank or `~/Documents` auto-detects your real
           Documents folder (a redirected `D:/Documents` or network Documents included). Type any
           other folder to override; a leading `~` there expands to your home folder.

    - name: export_filename
      type: String
      title: "/"
      default: "Table"
      description:
          R: >
           The bare file name, with NO extension (the chosen format adds it). Illegal characters are
           removed automatically. Blank saves as "Table".

    - name: resetPath
      title: "Reset to defaults"
      type: Action
      description:
        R: "Reset the folder and file name to their defaults (your Documents folder and \"Table\")."

    - name: xl_replace
      title: "" #
      type: Bool
      default: false
      description:
          R: >
           "Set to `TRUE` to overwrite an existing file."


...




