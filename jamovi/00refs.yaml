---

# The works a Crosstables or a Regressions result rests on, cited in jamovi's own References list.
# One entry per name an analysis names in its `refs:`; the two analyses cite what they actually run
# (the fitting backends they may reach, and the interval / residual methods the footer names).
# ⚠ Software entries are the packages' own (DESCRIPTION title and authors); method entries carry
# author, year, title and journal only -- what the package's own reference lists already state
# (dev/inference.md, dev/regression.md) and nothing invented around it.

tabxplor:
    type: software
    author: Nocenti, B.
    year: 2026
    title: "tabxplor: User-Friendly Tables with Color Helpers for Data Exploration"
    publisher: "[R package]"
    url: https://cran.r-project.org/package=tabxplor

survey:
    type: software
    author: Lumley, T.
    year: 2026
    title: "survey: Analysis of Complex Survey Samples"
    publisher: "[R package]"
    url: https://cran.r-project.org/package=survey

MASS:
    type: book
    author: Venables, W. N., & Ripley, B. D.
    year: 2002
    title: Modern Applied Statistics with S
    publisher: Springer
    url: https://www.stats.ox.ac.uk/pub/MASS4/

# nnet (multinom) ships with no citation of its own: it is the MASS book's, under its own name so a
# regression table can cite the fitter it really ran.
nnet:
    type: book
    author: Venables, W. N., & Ripley, B. D.
    year: 2002
    title: Modern Applied Statistics with S
    publisher: Springer
    url: https://cran.r-project.org/package=nnet

marginaleffects:
    type: software
    author: Arel-Bundock, V.
    year: 2026
    title: "marginaleffects: Predictions, Comparisons, Slopes, Marginal Means, and Hypothesis Tests"
    publisher: "[R package]"
    url: https://cran.r-project.org/package=marginaleffects

VGAM:
    type: book
    author: Yee, T. W.
    year: 2015
    title: Vector Generalized Linear and Additive Models
    publisher: Springer
    url: https://cran.r-project.org/package=VGAM

