title: Crosstables
name: jmvtab
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtab::update
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: <b>row_vars = <i>(row variables)</i></b>
        children:
          - type: VariablesListBox
            name: row_vars
            isTarget: true
            events:
              change: ./jmvtab::onChange_vars
      - type: TargetLayoutBox
        label: <b>col_vars = <i>(column variables)</i></b>
        children:
          - type: VariablesListBox
            name: col_vars
            isTarget: true
            events:
              change: ./jmvtab::onChange_vars
      - type: TargetLayoutBox
        label: <b>tab_vars = <i>(subtables variables)</i></b>
        children:
          - type: VariablesListBox
            name: tab_vars
            isTarget: true
            events:
              change: ./jmvtab::onChange_vars
      - type: TargetLayoutBox
        label: <b>wt = <i>(weights)</i></b>
        children:
          - type: VariablesListBox
            name: wt
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: <b>Percentages, colors and tests</b>
    stretchFactor: 1
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 2
            children:
              - type: Label
                label: pct = <i>(type of percentages)</i>
                fitToGrid: true
                children:
                  - type: RadioButton
                    name: pct_1
                    optionName: pct
                    optionPart: 'no'
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: pct_2
                    optionName: pct
                    optionPart: row
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: pct_3
                    optionName: pct
                    optionPart: col
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: pct_4
                    optionName: pct
                    optionPart: all
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: pct_5
                    optionName: pct
                    optionPart: all_tabs
                    events:
                      change: ./jmvtab::onChange_refopts
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 3
            children:
              - type: Label
                label: color = <i>(what to measure for colors)</i>
                fitToGrid: true
                children:
                  - type: RadioButton
                    name: color_1
                    optionName: color
                    optionPart: 'no'
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: color_2
                    optionName: color
                    optionPart: auto
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: color_3
                    optionName: color
                    optionPart: difference
                    enable: (pct:row || pct:col)
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: color_4
                    optionName: color
                    optionPart: ratio
                    enable: (pct:row || pct:col)
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: color_5
                    optionName: color
                    optionPart: odds_ratio
                    enable: (pct:row || pct:col)
                    events:
                      change: ./jmvtab::onChange_refopts
                  - type: RadioButton
                    name: color_6
                    optionName: color
                    optionPart: contrib
                    events:
                      change: ./jmvtab::onChange_refopts
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 2
            children:
              - type: Label
                label: display = <i>(what each cell shows)</i>
                children:
                  - type: ComboBox
                    name: display
                    events:
                      change: ./jmvtab::onChange_refopts
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 3
            children:
              - type: Label
                label: color_signif = <i>(significance policy)</i>
                fitToGrid: true
                children:
                  - type: RadioButton
                    name: color_signif_1
                    optionName: color_signif
                    optionPart: ignore
                  - type: RadioButton
                    name: color_signif_2
                    optionName: color_signif
                    optionPart: grey_non_signif
                    enable: (!(color:no))
                  - type: RadioButton
                    name: color_signif_3
                    optionName: color_signif
                    optionPart: guaranteed_effect
                    enable: (!(color:no))
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: >-
              <b>test = <i>(Chi2 and Cramer’V for categorical; ANOVA F and eta2 for
              numeric)</i></b>
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell:
                  column: 0
                  row: 0
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: test
              - type: LayoutBox
                cell:
                  column: 1
                  row: 0
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: anova
                    label: ANOVA F
                    enable: (test)
              - type: LayoutBox
                cell:
                  column: 0
                  row: 1
                stretchFactor: 0
                children:
                  - type: CheckBox
                    name: design_effect
                    label: "design_effect = <i>(design effect of the weights)</i>"
  - type: CollapseBox
    label: <b>Levels and missing values</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: small
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: 'na = <i>(missing values)</i> '
                children:
                  - type: RadioButton
                    name: na_1
                    optionName: na
                    optionPart: keep
                  - type: RadioButton
                    name: na_2
                    optionName: na
                    optionPart: drop
                  - type: RadioButton
                    name: na_3
                    optionName: na
                    optionPart: drop_all
                  - type: RadioButton
                    name: na_4
                    optionName: na
                    optionPart: common_base
          - type: LayoutBox
            margin: small
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: levels = <i>(which col_var levels to keep)</i>
                children:
                  - type: RadioButton
                    name: lvs_1
                    optionName: lvs
                    optionPart: all
                  - type: RadioButton
                    name: lvs_2
                    optionName: lvs
                    optionPart: first
                  - type: RadioButton
                    name: lvs_3
                    optionName: lvs
                    optionPart: auto
          - type: LayoutBox
            margin: none
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: TextBox
                name: n_min
                format: number
          - type: LayoutBox
            margin: none
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: CheckBox
                name: cleannames

      - type: LayoutBox
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: Label
            label: >-
              <b>Reorder levels</b> <i>(click on a level, then move it
              up/down)</i>
            children:
              - type: CustomControl
                name: levelOrderCtrl
                stretchFactor: 1
                events:
                  creating: ./jmvtab::levelOrderCtrl_creating
                  updated: ./jmvtab::levelOrderCtrl_updated
      - type: LayoutBox
        margin: none
        children:
          - type: TextBox
            name: other_if_less_than
            format: number
  - type: CollapseBox
    label: <b>References (points of comparison)</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: refPickerCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtab::refPickerCtrl_creating
              updated: ./jmvtab::refPickerCtrl_updated
      - type: LayoutBox
        margin: none
        children:
          - type: ComboBox
            name: comp
            label: comp = <i>(reference table with tab_vars)</i>
  - type: CollapseBox
    label: <b>Confidence intervals</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            margin: none
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: ci = <i>(confidence intervals)</i>
                children:
                  - type: RadioButton
                    name: ci_1
                    optionName: ci
                    optionPart: auto
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
                  - type: RadioButton
                    name: ci_2
                    optionName: ci
                    optionPart: 'no'
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
                  - type: RadioButton
                    name: ci_3
                    optionName: ci
                    optionPart: cell
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
                  - type: RadioButton
                    name: ci_4
                    optionName: ci
                    optionPart: ref
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
          - type: LayoutBox
            margin: none
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: options('tabxplor.ci_print' = ...)
                children:
                  - type: RadioButton
                    name: ci_print_1
                    optionName: ci_print
                    optionPart: ci
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
                  - type: RadioButton
                    name: ci_print_2
                    optionName: ci_print
                    optionPart: moe
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
          - type: LayoutBox
            margin: none
            cell:
              column: 0
              row: 1
            stretchFactor: 0
            children:
              - type: Label
                label: conf_level = <i>(confidence level)</i>
                children:
                  - type: TextBox
                    name: conf_level
                    format: number
                    enable: (pct:row || pct:col || pct:all || pct:all_tabs)
          - type: LayoutBox
            margin: none
            cell:
              column: 1
              row: 1
            stretchFactor: 0
            children:
              - type: Label
                label: stars = <i>(significance stars)</i>
                children:
                  - type: CheckBox
                    name: stars
                    enable: (ci:ref || ci:auto)
      - type: CollapseBox
        label: <b>Confidence-interval methods (advanced)</b>
        stretchFactor: 1
        collapsed: true
        children:
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                margin: none
                cell:
                  column: 0
                  row: 0
                stretchFactor: 0
                children:
                  - type: Label
                    label: ci_method = c(<b>cell</b> = ) <i>(a cell proportion)</i>
              - type: LayoutBox
                margin: none
                cell:
                  column: 1
                  row: 0
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: ci_method_cell
                    enable: (ci:cell || ci:auto)
              - type: LayoutBox
                margin: none
                cell:
                  column: 0
                  row: 1
                stretchFactor: 0
                children:
                  - type: Label
                    label: ci_method = c(<b>diff</b> = ) <i>(a difference in proportion)</i>
              - type: LayoutBox
                margin: none
                cell:
                  column: 1
                  row: 1
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: ci_method_diff
                    enable: (ci:ref || ci:auto)
              - type: LayoutBox
                margin: none
                cell:
                  column: 0
                  row: 2
                stretchFactor: 0
                children:
                  - type: Label
                    label: ci_method = c(<b>mean_diff</b> = ) <i>(a mean difference)</i>
              - type: LayoutBox
                margin: none
                cell:
                  column: 1
                  row: 2
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: ci_method_mean_diff
                    enable: (ci:ref || ci:auto)
              - type: LayoutBox
                margin: none
                cell:
                  column: 0
                  row: 3
                stretchFactor: 0
                children:
                  - type: Label
                    label: ci_method = c(<b>mean_ratio</b> = ) <i>(a mean ratio)</i>
              - type: LayoutBox
                margin: none
                cell:
                  column: 1
                  row: 3
                stretchFactor: 1
                children:
                  - type: ComboBox
                    name: ci_method_mean_ratio
                    enable: (ci:ref || ci:auto)
  - type: CollapseBox
    label: <b>Other formatting</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 0
        children:
          - type: Label
            label: totaltab = <i>(with tab_vars, add a total table)</i>
            fitToGrid: true
            children:
              - type: RadioButton
                name: totaltab_1
                optionName: totaltab
                optionPart: line
              - type: RadioButton
                name: totaltab_2
                optionName: totaltab
                optionPart: table
              - type: RadioButton
                name: totaltab_3
                optionName: totaltab
                optionPart: 'no'
      - type: LayoutBox
        margin: none
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: Label
            label: wrap_rows = <i>(nb chars for line break)</i>
            children:
              - type: TextBox
                name: wrap_rows
                format: number
      - type: LayoutBox
        margin: none
        cell:
          column: 1
          row: 1
        stretchFactor: 1
        children:
          - type: Label
            label: wrap_cols = <i>(nb chars for line break)</i>
            children:
              - type: TextBox
                name: wrap_cols
                format: number
      - type: LayoutBox
        margin: none
        cell:
          column: 0
          row: 3
        stretchFactor: 1
        children:
          - type: Label
            label: add_n = <i>(see unweighted counts)</i>
            children:
              - type: CheckBox
                name: add_n
                enable: (pct:row || pct:col)
      - type: LayoutBox
        margin: none
        cell:
          column: 1
          row: 3
        stretchFactor: 1
        children:
          - type: Label
            label: add_pct = <i>(see frequencies of 100% total)</i>
            children:
              - type: CheckBox
                name: add_pct
                enable: (pct:row || pct:col)
      - type: LayoutBox
        margin: none
        cell:
          column: 0
          row: 4
        stretchFactor: 1
        children:
          - type: Label
            label: digits = <i>(number of digits)</i>
            children:
              - type: ComboBox
                name: digits
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      # Phase h: full-width subtext box (stretchFactor on the label wrapper too, so the <textarea> fills
      # the width to its right rather than sitting thin under a narrow label).
      - type: Label
        label: subtext = <i>(text to print below the table)</i>
        stretchFactor: 1
        children:
          - type: CustomControl
            name: subtextCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtab::subtextCtrl_creating
              updated: ./jmvtab::subtextCtrl_updated
  # Phase o: the rule that sets the (outside-the-collapse-hierarchy) Export block apart is drawn by
  # js/jmvtab.js styleExportSep() (a border-top on this block) -- a former <hr> Label showed as raw text.
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      # Row 1: the Export action, the Format selector, the Replace-existing toggle.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: ActionButton
                name: exportExcel
                label: Export
                events:
                  change: ./jmvtab::exportExcel_changed
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: ComboBox
                name: export_format
                events:
                  change: ./jmvtab::export_format_changed
      # Row 2: ONE full-width path line -- "Path:" <folder> " / " <filename> <.ext>.
      #   folder : filename width = 3 : 2. This ratio only holds because js injectExportCss() collapses
      #   the TextBoxes' ~200px max-content floor -- otherwise both cells bottom out at 200px (see the js).
      #   The label / separator / extension cells are stretch 0, so they take only their text width.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_dir
                format: string
                width: largest
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_filename
                format: string
                width: large
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 0
            children:
              - type: CustomControl
                name: extCtrl
                events:
                  creating: ./jmvtab::extCtrl_creating
                  updated: ./jmvtab::extCtrl_updated
      # Row 3: a discreet, right-aligned "default path" reset, sitting under the file-name box.            
      - type: LayoutBox
        margin: none
        children:
          - type: CheckBox
            name: xl_replace
            label: Replace existing file
       # Row 4: a discreet, right-aligned "default path" reset.
      - type: LayoutBox
        margin: none
        children:
          - type: ActionButton
            name: resetPath
            label: Reset default path
            events:
              change: ./jmvtab::resetPath_changed
