---
name:  jmvtabreg
title: Regressions
menuGroup: tabxplor
version: '1.0.0'
jas: '1.2'
weightsSupport: 'full'

options:
    - name: data
      type: Data
      description:
          R: >
           A data.frame.

    - name: dependent
      title: "<b>dependent = <i>(outcome variable[s])</i></b>"
      type: Variables
      permitted: [numeric, factor]
      default: NULL
      description:
          R: >
           The outcome variable(s). One model is built per dependent. Set each outcome's
           family (and, for a binomial outcome, its modelled level or number of trials) in
           the Model table.

    - name: predictors
      title: "<b>predictors = <i>(explanatory variables)</i></b>"
      type: Variables
      permitted: [numeric, factor]
      default: NULL
      description:
          R: >
           The explanatory variables of the model. Factors are shown one line per
           level (the reference level as the neutral value); numeric predictors as
           a single line.

    - name: split_var
      title: "<b>split_var = <i>(fit within each group)</i></b>"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: NULL
      description:
          R: >
           A grouping variable. The same model is fitted within each of its levels
           and the tables are stacked (like tab_vars for crosstables).

    - name: wt
      title: "<b>wt = <i>(survey weights)</i></b>"
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description:
          R: >
           A survey weight variable. Switches to design-based estimation (scale-invariant
           sandwich standard errors). Leave empty for unweighted results.

# ============================ Model ============================
# Per-dependent Model table (family / modelled level / trials) -> the hidden arrays below,
# driven by the `modelTableCtrl` CustomControl (one row per dependent).
    - name: depFamily
      title: "Family (per dependent)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: family
                type: String

    - name: depModelLevel
      title: "Binomial modelled level (per dependent)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: level
                type: String

    - name: depTrials
      title: "Binomial trials (per dependent)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: n
                type: String

    - name: exponentiate
      title: exponentiate
      type: Bool
      default: true
      description:
          R: >
           Exponentiate the coefficients into ratios (odds ratios / incidence-rate ratios),
           automatically leaving gaussian linear coefficients on their raw scale. Uncheck to
           keep every coefficient on the coefficient (log / linear) scale.

    - name: effect
      title: effect
      type: List
      options:
        - title: "coefficient (per-family effect)"
          name:  coefficient
        - title: "AME (average marginal effect)"
          name:  ame
      default: coefficient
      description:
          R: >
           "coefficient" is the native per-family effect (beta / OR / IRR).
           "AME" is the average marginal effect on the response scale (needs the
           marginaleffects package).

    - name: at
      title: at
      type: List
      options:
        - title: "average (over the sample)"
          name:  average
        - title: "at the reference profile"
          name:  reference
      default: average
      description:
          R: >
           Where marginal effects are evaluated: averaged over the sample, or at the
           reference profile (other predictors at their reference level / mean).

    - name: empirical
      title: empirical
      type: Bool
      default: false
      description:
          R: >
           Add the crude, unadjusted, single-predictor companion columns beside the
           model effect (the bivariate association that IS the modelised quantity with
           a single predictor). Binomial / gaussian / poisson only.

# ================= Model comparison (+ predictor subsets) =================
    - name: models
      title: "Predictor subsets (model comparison)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: label
                type: String
              - name: vars
                type: Array
                template:
                    type: Variable

    - name: baseline
      title: "Baseline model position"
      type: Integer
      hidden: true
      min: 1
      default: 1

    - name: compare
      title: compare
      type: List
      options:
        - { title: "none",                      name: none }
        - { title: "vs a baseline model",       name: baseline }
        - { title: "sequential (vs prev.)",     name: sequential }
      default: none
      description:
          R: >
           With several models (a predictor-subset list), add a likelihood-ratio / F / Wald
           comparison-test footer row: "baseline" tests each model against the chosen baseline
           model, "sequential" against the previous one (an AIC difference when not nested).

    - name: na
      title: na
      type: List
      options:
        - title: "drop by model (per-model complete cases)"
          name:  drop_by_model
        - title: "drop all models (one shared population)"
          name:  drop_all_models
      default: drop_by_model
      description:
          R: >
           "drop by model" fits each model / outcome on its own complete cases; "drop all
           models" uses one shared complete-case population across all predictors (equal N;
           changes the estimates), which a valid likelihood-ratio comparison test needs.

    # Phase h: a model comparison (>=2 models) is heavy -- refitting every model on each live edit is
    # what froze the panel. So with several models the table computes ONLY on this button: the user
    # picks the models, then clicks to run. Single-model use stays fully live (no button needed).
    - name: run_compare
      title: "Run comparison"
      type: Action

# ================= References and predictor scaling =================
    - name: refLevels
      title: "Reference levels (per predictor)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: ref
                type: String

    - name: multiplicator
      title: "Predictor scaling (per k units)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: k
                type: String

# ============================ Significance ============================
    - name: conf_level
      title: "Confidence level"
      type: Number
      min: 0.5
      max: 0.999
      default: 0.95
      description:
          R: >
           The confidence level for intervals and the significance stars.

    - name: method
      title: method
      type: List
      options:
        - title: "Wald"
          name:  wald
        - title: "profile-likelihood"
          name:  profile
      default: wald
      description:
          R: >
           Wald intervals (also the only option for weighted models) or
           profile-likelihood intervals (unweighted binomial / poisson only; needs MASS).

    - name: stars
      title: stars
      type: Bool
      default: true
      description:
          R: >
           Show per-cell significance stars (the colours read the confidence interval
           either way).

    - name: color
      title: color
      type: Bool
      default: true
      description:
          R: >
           Colour the effect cells with the sensible per-family colour helper (OR magnitude
           for ratios, standardized difference for gaussian betas). Uncheck for no colours.

    - name: color_signif
      title: color_signif
      type: List
      options:
        - title: "grey_non_signif <i>(color effect size + uncolor non-significant)</i>"
        #####    "guaranteed_effect <i>(only the CI-guaranteed effect)</i>"
          name:  grey_non_signif
        - title: "guaranteed_effect <i>(color all CI-floor, ideal for small sample)</i>"
          name:  guaranteed_effect
        - title: "ignore <i>(color effect size only, ignore significance)</i>"
          name:  ignore
      default: grey_non_signif
      description:
          R: >
           How significance interacts with the colours: observed size + grey out non-significant 
           cells, colour only the guaranteed (error-adjusted) effect, ignore significance.

# ==================== Missing values and display ====================
    - name: estimate_display
      title: estimate_display
      type: List
      options:
        - title: "value (plain estimate)"
          name:  value
        - title: "with confidence interval"
          name:  ci
        - title: "with predicted probability"
          name:  prob
        - title: "with marginal effect"
          name:  ame
      default: value
      description:
          R: >
           The estimate-cell layout. "ci" shows a visible interval; "prob" / "ame"
           fold the adjusted predicted probability / marginal effect into the OR cell
           (binomial coefficient models only).

    - name: cleannames
      title: cleannames
      type: Bool
      default: true
      description:
          R: >
           Strip numeric prefixes from factor level labels.

    - name: subtext
      title: "Note below the table"
      type: String
      default: ""
      hidden: true      # driven by the subtextCtrl CustomControl (a full-width auto-grow textarea)
      description:
          R: >
           A free note printed below the table.

    - name: wrap_rows
      title: "Wrap row labels at"
      type: Number
      min: 0
      default: 35

    - name: wrap_cols
      title: "Wrap column headers at"
      type: Number
      min: 0
      default: 15

# ================ Advanced: survey design (only used with a weight) ================
    - name: ids
      title: "<b>ids = <i>(cluster ids)</i></b>"
      type: Variables
      default: NULL
      description:
          R: >
           Cluster identifiers (survey design), largest to smallest stage. Only used
           with a weight; leave empty for no clustering.

    - name: strata
      title: "<b>strata = <i>(strata)</i></b>"
      type: Variables
      default: NULL
      description:
          R: >
           Stratification variables (survey design). Only used with a weight.

    - name: fpc
      title: "<b>fpc = <i>(finite population)</i></b>"
      type: Variable
      default: NULL
      description:
          R: >
           Finite-population correction (survey design). Only used with a weight.

    - name: nest
      title: "cluster ids nested within strata"
      type: Bool
      default: false
      description:
          R: >
           Set when cluster ids are reused across strata (survey design).

# ============================ Export ============================
    - name: export_format
      title: Export format
      type: List
      options:
        - title: Excel
          name:  excel
        - title: HTML
          name:  html
        - title: Markdown
          name:  md
      default: excel

    - name: exportExcel
      title: "Export"
      type: Action
      description:
        R: "Press to export the table to the chosen format (the button label follows the format)."

    - name: export_dir
      title: "Folder"
      type: String
      default: "~/Documents"
      description:
          R: >
           The folder to save the exported file in. Blank or `~/Documents` auto-detects your real
           Documents folder (a redirected `D:\Documents` or network Documents included). Type any
           other folder to override; a leading `~` there expands to your home folder.

    - name: export_filename
      title: "Save to (file name)"
      type: String
      default: "Regression"
      description:
          R: >
           The bare file name, with NO extension (the chosen format adds it). Illegal characters are
           removed automatically. Blank saves as "Table".

    - name: resetPath
      title: "Reset to defaults"
      type: Action
      description:
        R: "Reset the folder and file name to their defaults (your Documents folder and \"Regression\")."

    - name: xl_replace
      title: "Replace existing file"
      type: Bool
      default: false
...
