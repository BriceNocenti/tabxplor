---
name:  jmvtabreg
title: Regressions
menuGroup: tabxplor
version: '1.0.0'
jas: '1.2'
weightsSupport: 'full'

options:
    - name: data
      type: Data
      description:
          R: >
           A data.frame.

    - name: outcome
      title: "<b>outcome = <i>(dependent variable[s])</i></b>"
      type: Variables
      permitted: [numeric, factor]
      default: NULL
      description:
          R: >
           The outcome variable(s). One model is built per outcome. Set each outcome's
           family (and, for a binomial outcome, its modelled level or number of trials) in
           the Model table.

    - name: predictors
      title: "<b>predictors = <i>(explanatory variables)</i></b>"
      type: Variables
      permitted: [numeric, factor]
      default: NULL
      description:
          R: >
           The explanatory variables of the model. Factors are shown one line per
           level (the reference level as the neutral value); numeric predictors as
           a single line.

    - name: tab_vars
      title: "<b>tab_vars = <i>(fit within each group)</i></b>"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: NULL
      description:
          R: >
           A grouping variable. The same model is fitted within each of its levels
           and the tables are stacked (like tab_vars for crosstables).

    - name: wt
      title: "<b>wt = <i>(survey weights)</i></b>"
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description:
          R: >
           A survey weight variable. Switches to design-based estimation (scale-invariant
           sandwich standard errors). Leave empty for unweighted results.

# ============================ Model ============================
# Per-outcome Model table (family / outcome_level / trials) -> the hidden arrays below,
# driven by the `modelTableCtrl` CustomControl (one row per outcome).
    - name: family
      title: "family (per outcome)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: family
                type: String

    - name: outcome_level
      title: "outcome_level (per outcome)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: level
                type: String

    - name: trials
      title: "trials (per outcome)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: "n"
                type: String

    - name: effect
      title: effect
      type: List
      options:
        - title: "coefficient <i>(the model's own effect)</i>"
          name:  coefficient
        - title: "marginal <i>(average marginal effect)</i>"
          name:  marginal
        - title: "at the reference profile"
          name:  at_reference
      default: coefficient
      description:
          R: >
           WHICH CONTRAST the table reports.
            \itemize{
             \item \code{"coefficient"}: the model's native per-family effect.
             \item \code{"marginal"}: the average marginal effect on the response scale, averaged
             over the sample (needs the marginaleffects package).
             \item \code{"at_reference"}: the same, evaluated at the reference profile (other
             predictors at their reference level / mean).
            }

    - name: measure
      title: measure
      type: List
      options:
        - title: "auto <i>(the family's usual measure)</i>"
          name:  auto
        - title: "odds ratio (OR)"
          name:  odds_ratio
        - title: "ratio (RR / IRR / MR)"
          name:  ratio
        - title: "difference (RD / AME / beta)"
          name:  difference
        - title: "log <i>(un-exponentiated coefficient)</i>"
          name:  log
      default: auto
      description:
          R: >
           WHICH MEASURE the contrast is expressed in -- the second half of the estimand, and the
            only argument that changes the MODEL (a risk ratio, a risk difference and an odds ratio
            are three fits, not three displays of one).
            \itemize{
             \item \code{"auto"}: the usual measure of the outcome's family (OR for binomial /
             ordinal / multinomial, IRR for poisson, beta for gaussian).
             \item \code{"odds_ratio"} / \code{"ratio"} / \code{"difference"}: the named measure,
             when the outcome offers it. A combination the outcome does not offer says so, and lists
             what it does offer.
             \item \code{"log"}: the family's usual estimand, left un-exponentiated.
            }

    - name: empirical
      title: empirical
      type: List
      options:
        - name: 'no'
        - name: column
        - name: cell
      default: 'no'
      description:
          R: >
           Show the crude, unadjusted, single-predictor effect beside each model effect --- the
           bivariate association that IS the modelised quantity when there is a single predictor, so
           the gap between the two is what adjustment changed. \code{"column"} draws it as its own
           column; \code{"cell"} folds it into the model cell instead, which is the default for a
           3+ level outcome, where one model column would otherwise need one crude column per
           category.

# ================= Model comparison (+ predictor subsets) =================
    - name: models
      title: "Predictor subsets (model comparison)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: label
                type: String
              - name: vars
                type: Array
                template:
                    type: Variable

    - name: stats_baseline
      title: "stats_baseline (model position)"
      type: Integer
      hidden: true
      min: 1
      default: 1

    - name: stats_compare
      title: stats_compare
      type: List
      options:
        - { title: "none",                      name: none }
        - { title: "vs a baseline model",       name: compare_baseline }
        - { title: "sequential (vs prev.)",     name: compare_sequential }
      default: none
      description:
          R: >
           With several models (a predictor-subset list), add a likelihood-ratio / F / Wald
           comparison-test footer row: "compare_baseline" tests each model against the chosen baseline
           model, "sequential" against the previous one (an AIC difference when not nested).

    # Phase 20f made the two model checks that REFIT the model (linearity, proportional odds) opt-in:
    # they were 81-94% of a default call. `stats = "all"` is the one value that asks for everything,
    # and it composes with a comparison key -- reg_resolve_stats(c("all", "compare_baseline")).
    - name: stats_checks
      title: 'stats = <i>"all"</i> (slow model checks)'
      type: Bool
      default: false
      description:
          R: >
           Also run the model checks that have to refit the model (linearity of a numeric
           predictor, proportional odds). They are off by default because they dominate the cost
           of a table; everything else in the model-summary footer is always shown.

    - name: na
      title: na
      type: List
      options:
        - title: "one population per outcome (recommended)"
          name:  drop_by_outcome
        - title: "each model on its own complete cases"
          name:  drop_by_model
        - title: "one population for the whole analysis"
          name:  drop_all
      default: drop_by_outcome
      description:
          R: >
           "drop_by_outcome" (default) fits every model OF ONE OUTCOME on the same complete
           cases, which is what makes the observed columns comparable to the model beside them
           and lets the likelihood-ratio comparison run; "drop_by_model" gives each model its
           own complete cases (a model on a different population then gets no observed effect);
           "drop_all" shares one population across every outcome as well.

    # Phase h: a model comparison (>=2 models) is heavy -- refitting every model on each live edit is
    # what froze the panel. So with several models the table computes ONLY on this button: the user
    # picks the models, then clicks to run. Single-model use stays fully live (no button needed).
    - name: run_compare
      title: "Run comparison"
      type: Action

# ================= References, level merging and predictor scaling =================
    # Phase 20g-ii: the per-predictor level-MERGE tick-boxes (merge only -- reordering is meaningless
    # here, `ref` picks the baseline explicitly). Same shape and same folder as jmvtab's, and applied
    # by the same tab_collapse_levels() in reg_prepare_data()'s stage G0, before family detection and
    # the reference relevel -- so a merged level is simply a level.
    - name: levels_collapse
      title: "Merged levels (per predictor)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: label
                type: String
              - name: levels
                type: Array
                template:
                    type: String

    - name: ref_levels
      title: "ref (per predictor)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: ref
                type: String

    - name: shape
      title: "shape (per numeric predictor)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: shape
                type: String

    - name: multiplier
      title: "multiplier (per numeric predictor)"
      type: Array
      hidden: true
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: k
                type: String

# ============================ Significance ============================
    - name: conf_level
      title: "Confidence level"
      type: Number
      min: 0.5
      max: 0.999
      default: 0.95
      description:
          R: >
           The confidence level for intervals and the significance stars.

    - name: ci_method
      title: ci_method
      type: List
      options:
        - title: "Wald"
          name:  wald
        - title: "profile-likelihood"
          name:  profile
      default: wald
      description:
          R: >
           Wald intervals (also the only option for weighted models) or
           profile-likelihood intervals (unweighted binomial / poisson only; needs MASS).

    - name: stars
      title: stars
      type: Bool
      default: true
      description:
          R: >
           Show per-cell significance stars (the colours read the confidence interval
           either way).

    - name: color
      title: color
      type: List
      options:
        - title: "auto <i>(the column's own effect size)</i>"
          name:  auto
        - title: "no <i>(no colors)</i>"
          name:  "no"
        - title: "adjustment <i>(the gap between the model and the crude effect)</i>"
          name:  adjustment
        - title: "between_groups <i>(the gap between the split groups)</i>"
          name:  between_groups
      default: auto
      description:
          R: >
           WHAT the effect cells are coloured by. The colour LADDER always comes from what the
            column estimates (an odds ratio is read on the odds-ratio scale, a beta on the
            standardized-difference one), so what is left to choose is what the estimate is compared
            TO.
            \itemize{
             \item \code{"auto"}: the effect's own size (compared to no effect).
             \item \code{"no"}: no colours.
             \item \code{"adjustment"}: how far the ADJUSTED effect moved from the crude one --
             needs \code{empirical}.
             \item \code{"between_groups"}: how far each group's effect is from the first group's
             -- needs \code{tab_vars}.
            }

    - name: color_signif
      title: color_signif
      type: List
      options:
        - title: "ignore <i>(color effect size only, ignore significance)</i>"
          name:  ignore
        - title: "grey_non_signif <i>(color effect size + uncolor non-significant)</i>"
          name:  grey_non_signif
        - title: "guaranteed_effect <i>(color all CI-floor, ideal for small sample)</i>"
          name:  guaranteed_effect
      default: grey_non_signif
      description:
          R: >
           How significance interacts with the colours: observed size + grey out non-significant
           cells, colour only the guaranteed (error-adjusted) effect, ignore significance.

# ==================== Missing values and display ====================
    - name: display
      title: display
      type: List
      options:
        - title: "auto"
          name:  auto
        - title: "est <i>(the estimate)</i>"
          name:  est
        - title: "est_ci <i>(the estimate with its interval)</i>"
          name:  est_ci
        - title: "est_base <i>(the estimate, adjusted prediction in bracket)</i>"
          name:  est_base
        - title: "est_coef <i>(the estimate, coefficient in bracket)</i>"
          name:  est_coef
        - title: "base_est_mdiff <i>(the estimate, its difference form in bracket)</i>"
          name:  base_est_mdiff
        - title: "base_est_mratio <i>(the estimate, its ratio form in bracket)</i>"
          name:  base_est_mratio
        - title: "base_est <i>(the adjusted prediction, estimate in bracket)</i>"
          name:  base_est
        - title: "base <i>(adjusted predictions alone)</i>"
          name:  base
      default: auto
      description:
          R: >
           The estimate-cell LAYOUT (never the estimand: a display may fold in another quantity of
           the SAME fit, it can never change the fit). The same named layouts \code{tab()} offers,
           written in the same \code{\{\}} grammar: \code{est} is whatever the column estimates
           and \code{base} the level it sits on (an adjusted probability, an adjusted mean).
           \code{"auto"} keeps the built-in layout.

    - name: "n"   # quoted: YAML 1.1 reads a bare `n` as the boolean FALSE
      title: n
      type: List
      options:
        - name: range
          title: range
        - name: min
          title: min
        - name: "no"
          title: "no"
      default: range
      description:
          R: >
           The column giving the number of observations behind each predictor level:
           `"range"` prints `min-max` when several models were fitted on different people,
           `"min"` the smallest count only, `"no"` no column at all.

    - name: cleannames
      title: cleannames
      type: Bool
      default: true
      description:
          R: >
           Strip numeric prefixes from factor level labels.

    - name: subtext
      title: "Note below the table"
      type: String
      default: ""
      hidden: true      # driven by the subtextCtrl CustomControl (a full-width auto-grow textarea)
      description:
          R: >
           A free note printed below the table.

    - name: wrap_rows
      title: "Wrap row labels at"
      type: Number
      min: 0
      default: 35

    - name: wrap_cols
      title: "Wrap column headers at"
      type: Number
      min: 0
      default: 15

# ============================ Export ============================
    - name: export_format
      title: Format
      type: List
      options:
        - title: Excel
          name:  excel
        - title: HTML
          name:  html
        - title: Markdown
          name:  md
      default: excel

    - name: exportExcel
      title: "Export"
      type: Action
      description:
        R: "Press to export the table to the chosen format (the button label follows the format)."

    - name: export_dir
      title: "Path:"
      type: String
      default: "~/Documents"
      description:
          R: >
           The folder to save the exported file in. Blank or `~/Documents` auto-detects your real
           Documents folder (a redirected `D:/Documents` or network Documents included). Type any
           other folder to override; a leading `~` there expands to your home folder.

    - name: export_filename
      title: "/"
      type: String
      default: "Reg_model"
      description:
          R: >
           The bare file name, with NO extension (the chosen format adds it).

    - name: resetPath
      title: "Reset to defaults"
      type: Action
      description:
        R: "Reset the folder and file name to their defaults (your Documents folder and \"Regression\")."

    - name: xl_replace
      title: ""
      type: Bool
      default: false
      description:
          R: >
           "Set to `TRUE` to overwrite an existing file."
...



