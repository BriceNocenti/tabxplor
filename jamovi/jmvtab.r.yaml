    # Phase 15c: the former width-forcing `plot` Image is GONE. Results width is now handled purely by
    # the html scroll box (tab_render_scrollbox: width:max-content; max-width; overflow-x:auto), so no
    # spacer Image is needed -- jmvtabreg has always worked with cache_state alone.

    # Phase 7e: hidden state carrier for the multi-tier live cache. Only Image elements persist a
    # `$state` across the engine reset, so this 0-size Image hosts the (gzip-RDS'd) store. It renders
    # nothing (.plot returns TRUE); `.run()` reads/writes self$results$cache_state$state.
    - name: cache_state
      title: ""
      type: Image
      width: 1080
      height: 1
      renderFun: .plot

