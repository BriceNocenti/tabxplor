---
name:  jmvtab
title: Crosstables
jrs:   '1.1'

# TWO live items, and that is the whole results model: tabxplor renders ONE html table (the colour,
# the footer and the test summary are all inside it -- see R/tab-render-html.R), so there is no
# Table / Image element to declare. Phase 15c also removed the width-forcing `plot` Image: the
# scroll box (tab_render_scrollbox: width:max-content; max-width; overflow-x:auto) owns the width.
items:

    - name: html_table
      title: Table
      type: Html

    # Phase 7e: hidden state carrier for the multi-tier live cache. Only Image elements persist a
    # `$state` across the engine reset, so this Image hosts the (gzip-RDS'd) store. It renders
    # nothing (.plot returns TRUE); `.run()` reads/writes self$results$cache_state$state.
    # ⚠ `visible: false` is what makes it take NO vertical space (height: 1 still reserved a slot),
    # and it is safe for the store TWICE OVER: ResultsElement$asProtoBuf() serialises `state`
    # independently of `visible`, and Image$asProtoBuf() reports a state-holding image that rendered
    # no file as ANALYSIS_RENDERING -- so a VISIBLE carrier makes the client ask for a render whose
    # round-trip can overwrite the run's own results (Phase 22g-vi, jmvtabreg.r.yaml).
    - name: cache_state
      title: ""
      type: Image
      width: 1080
      height: 1
      renderFun: .plot
      visible: false
...
