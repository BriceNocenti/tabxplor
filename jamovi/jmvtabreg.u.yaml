title: Regressions
name: jmvtabreg
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtabreg::update
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: <b>outcome = <i>(dependent variable[s])</i></b>
        children:
          - type: VariablesListBox
            name: outcome
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>predictors = <i>(explanatory variables)</i></b>
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>tab_vars = <i>(fit within each group)</i></b>
        children:
          - type: VariablesListBox
            name: tab_vars
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>wt = <i>(survey weights)</i></b>
        children:
          - type: VariablesListBox
            name: wt
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars

  - type: CollapseBox
    label: <b>Model</b>
    stretchFactor: 1
    collapsed: false
    children:
      # Per-outcome Model table: one row per outcome -> [name] [family] [outcome_level / trials].
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelTableCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelTableCtrl_creating
              updated:  ./jmvtabreg::modelTableCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          # Phase 19k: the estimand is TWO questions -- which contrast, and in which measure. The
          # retired `exponentiate` checkbox and `at` radios are folded into them (`at = "reference"`
          # is the third `effect`; un-exponentiated is `measure = "log"`).
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell: { column: 0, row: 0 }
                children:
                  - type: Label
                    label: effect = <i>(which contrast)</i>
                    children:
                      - type: RadioButton
                        name: effect_1
                        optionName: effect
                        optionPart: coefficient
                      - type: RadioButton
                        name: effect_2
                        optionName: effect
                        optionPart: marginal
                      - type: RadioButton
                        name: effect_3
                        optionName: effect
                        optionPart: at_reference
              - type: LayoutBox
                cell: { column: 1, row: 0 }
                children:
                  - type: Label
                    label: measure = <i>(which measure)</i>
                    children:
                      - type: RadioButton
                        name: measure_1
                        optionName: measure
                        optionPart: auto
                      - type: RadioButton
                        name: measure_2
                        optionName: measure
                        optionPart: odds_ratio
                      - type: RadioButton
                        name: measure_3
                        optionName: measure
                        optionPart: ratio
                      - type: RadioButton
                        name: measure_4
                        optionName: measure
                        optionPart: difference
                      - type: RadioButton
                        name: measure_5
                        optionName: measure
                        optionPart: log
          - type: ComboBox
            name: empirical
            label: empirical = <i>(show the observed effect beside the modelled one)</i>

  - type: CollapseBox
    label: <b>Model comparison (+ predictor subsets)</b>
    stretchFactor: 1
    collapsed: true
    children:
      # The model-builder "+" cards first, then the comparison test, then how missing values are dropped.
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelBuilderCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelBuilderCtrl_creating
              updated:  ./jmvtabreg::modelBuilderCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: stats = <i>(model-summary footer)</i>
                children:
                  - type: ComboBox
                    name: stats_compare
                    events:
                      change: ./jmvtabreg::onChange_compare
                  # Phase 20g-i: the control 20f owes -- the two checks that REFIT the model are
                  # opt-in since then, and nothing offered them.
                  - type: CheckBox
                    name: stats_checks
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: na = <i>(missing values)</i>
                children:
                  - type: RadioButton
                    name: na_1
                    optionName: na
                    optionPart: drop_by_outcome
                  - type: RadioButton
                    name: na_2
                    optionName: na
                    optionPart: drop_by_model
                  - type: RadioButton
                    name: na_3
                    optionName: na
                    optionPart: drop_all
      # Phase h: with >=2 models the table computes only on this click (no live refit while picking).
      - type: LayoutBox
        margin: large
        children:
          - type: ActionButton
            name: run_compare
            label: Run comparison
            events:
              change: ./jmvtabreg::run_compare_changed

  - type: CollapseBox
    label: <b>References, level merging and predictor scaling</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: refPickerCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::refPickerCtrl_creating
              updated: ./jmvtabreg::refPickerCtrl_updated

  - type: CollapseBox
    label: <b>Significance</b>
    stretchFactor: 1
    collapsed: true
    children:
      # Row 1 (3 equal columns): "Show:" | the colour toggle | the stars toggle.
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: "<b>Show:</b>"
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: ComboBox
                name: color
                label: color =
          - type: LayoutBox
            cell: { column: 2, row: 0 }
            stretchFactor: 1
            children:
              - type: CheckBox
                name: stars
                label: stars = <i>(significance stars)</i>
      # Row 2 (3 columns): confidence level + box | the method legend | its radio buttons (no 2nd title).
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: "conf_level ="
                children:
                  - type: TextBox
                    name: conf_level
                    format: number
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: ci_method = <i>(conf. interval)</i>
          - type: LayoutBox
            cell: { column: 2, row: 0 }
            stretchFactor: 1
            children:
              - type: RadioButton
                name: ci_method_1
                optionName: ci_method
                optionPart: wald
              - type: RadioButton
                name: ci_method_2
                optionName: ci_method
                optionPart: profile
      # Row 3: the significance policy across the full width (greyed out when colours are off).
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: color_signif = <i>(significance policy)</i>
            children:
              - type: RadioButton
                name: color_signif_1
                optionName: color_signif
                optionPart: ignore
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_2
                optionName: color_signif
                optionPart: grey_non_signif
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_3
                optionName: color_signif
                optionPart: guaranteed_effect
                enable: (!(color:no))

  - type: CollapseBox
    label: <b>Display</b>
    stretchFactor: 1
    collapsed: true
    children:
      # Row 1: display (left half) | one common title over wrap_rows / wrap_cols / cleannames
      # (right half) -- one bold group title instead of a legend repeated on every control.
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: display = <i>(cell layout)</i>
                children:
                  - type: RadioButton
                    name: display_1
                    optionName: display
                    optionPart: auto
                  - type: RadioButton
                    name: display_2
                    optionName: display
                    optionPart: est_ci
                  - type: RadioButton
                    name: display_3
                    optionName: display
                    optionPart: est_base
                    enable: (effect_1)
                  - type: RadioButton
                    name: display_4
                    optionName: display
                    optionPart: base_est
                    enable: (effect_1)
                  - type: RadioButton
                    name: display_5
                    optionName: display
                    optionPart: base
                    enable: (effect_1)
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: "<b>Table layout</b>"
              - type: Label
                label: "wrap_rows ="
                children:
                  - type: TextBox
                    name: wrap_rows
                    format: number
              - type: Label
                label: "wrap_cols ="
                children:
                  - type: TextBox
                    name: wrap_cols
                    format: number
              - type: Label
                label: n = <i>(N per predictor level)</i>
                children:
                  - type: ComboBox
                    name: "n"
              - type: CheckBox
                name: cleannames
                label: cleannames = <i>(tidy level names)</i>
      # Phase 15c / h: the below-table note is a full-width, auto-grow <textarea> (CustomControl driving
      # the hidden `subtext`). stretchFactor on the row so the box fills the width to its right.
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: subtext = <i>(note below the table)</i>
            stretchFactor: 1
            children:
              - type: CustomControl
                name: subtextCtrl
                stretchFactor: 1
                events:
                  creating: ./jmvtabreg::subtextCtrl_creating
                  updated: ./jmvtabreg::subtextCtrl_updated

  # Phase o: the rule that sets the (outside-the-collapse-hierarchy) Export block apart is drawn by
  # js/jmvtab.js styleExportSep() (a border-top on this block) -- a former <hr> Label showed as raw text.
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      # Row 1: the Export action, the Format selector, the Replace-existing toggle.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: ActionButton
                name: exportExcel
                label: Export
                events:
                  change: ./jmvtabreg::exportExcel_changed
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: ComboBox
                name: export_format
                events:
                  change: ./jmvtabreg::export_format_changed
      # Row 2: ONE full-width path line -- "Path:" <folder> " / " <filename> <.ext>.
      #   folder : filename width = 3 : 2. This ratio only holds because js injectExportCss() collapses
      #   the TextBoxes' ~200px max-content floor -- otherwise both cells bottom out at 200px (see the js).
      #   The label / separator / extension cells are stretch 0, so they take only their text width.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_dir
                format: string
                width: largest
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_filename
                format: string
                width: large
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 0
            children:
              - type: CustomControl
                name: extCtrl
                events:
                  creating: ./jmvtabreg::extCtrl_creating
                  updated: ./jmvtabreg::extCtrl_updated
      # Row 3: a discreet, right-aligned "default path" reset, sitting under the file-name box.            
      - type: LayoutBox
        margin: none
        children:
          - type: CheckBox
            name: xl_replace
            label: Replace existing file
       # Row 4: a discreet, right-aligned "default path" reset.
      - type: LayoutBox
        margin: none
        children:
          - type: ActionButton
            name: resetPath
            label: Reset default path
            events:
              change: ./jmvtabreg::resetPath_changed


