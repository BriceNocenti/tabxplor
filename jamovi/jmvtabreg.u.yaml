title: Regressions
name: jmvtabreg
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtabreg::update
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: <b>dependent = <i>(outcome variable[s])</i></b>
        children:
          - type: VariablesListBox
            name: dependent
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>predictors = <i>(explanatory variables)</i></b>
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>split_var = <i>(fit within each group)</i></b>
        children:
          - type: VariablesListBox
            name: split_var
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>wt = <i>(survey weights)</i></b>
        children:
          - type: VariablesListBox
            name: wt
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars

  - type: CollapseBox
    label: <b>Model</b>
    stretchFactor: 1
    collapsed: false
    children:
      # Per-dependent Model table: one row per outcome -> [name] [family] [modelled level / trials].
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelTableCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelTableCtrl_creating
              updated:  ./jmvtabreg::modelTableCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: exponentiate
            label: exponentiate = <i>(odds / rate ratios when it makes sense)</i>
          # effect and at on one row (two columns).
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell: { column: 0, row: 0 }
                children:
                  - type: Label
                    label: effect = <i>(estimand)</i>
                    children:
                      - type: RadioButton
                        name: effect_1
                        optionName: effect
                        optionPart: coefficient
                      - type: RadioButton
                        name: effect_2
                        optionName: effect
                        optionPart: ame
              - type: LayoutBox
                cell: { column: 1, row: 0 }
                children:
                  - type: Label
                    label: at = <i>(profile, marginal effects)</i>
                    children:
                      - type: RadioButton
                        name: at_1
                        optionName: at
                        optionPart: average
                        enable: (effect_2)
                      - type: RadioButton
                        name: at_2
                        optionName: at
                        optionPart: reference
                        enable: (effect_2)
          - type: CheckBox
            name: empirical
            label: empirical = <i>(compare model estimates with observed values)</i>

  - type: CollapseBox
    label: <b>Model comparison (+ predictor subsets)</b>
    stretchFactor: 1
    collapsed: true
    children:
      # The model-builder "+" cards first, then the comparison test, then how missing values are dropped.
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelBuilderCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelBuilderCtrl_creating
              updated:  ./jmvtabreg::modelBuilderCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: compare = <i>(nested-model LR / F test)</i>
            children:
              - type: ComboBox
                name: compare
                events:
                  change: ./jmvtabreg::onChange_compare
          - type: Label
            label: na = <i>(missing values)</i>
            children:
              - type: RadioButton
                name: na_1
                optionName: na
                optionPart: drop_by_model
              - type: RadioButton
                name: na_2
                optionName: na
                optionPart: drop_all_models

  - type: CollapseBox
    label: <b>References and predictor scaling</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: refPickerCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::refPickerCtrl_creating
              updated: ./jmvtabreg::refPickerCtrl_updated

  - type: CollapseBox
    label: <b>Significance</b>
    stretchFactor: 1
    collapsed: true
    children:
      # Confidence level, interval method and stars on one row.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            children:
              - type: Label
                label: "Confidence level:"
                children:
                  - type: TextBox
                    name: conf_level
                    format: number
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            children:
              - type: Label
                label: method = <i>(interval)</i>
                children:
                  - type: RadioButton
                    name: method_1
                    optionName: method
                    optionPart: wald
                  - type: RadioButton
                    name: method_2
                    optionName: method
                    optionPart: profile
          - type: LayoutBox
            cell: { column: 2, row: 0 }
            children:
              - type: CheckBox
                name: stars
      # Colours: a single on/off, then the significance policy (greyed out when colours are off).
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: color
            label: color = <i>(colour helpers)</i>
          - type: Label
            label: color_signif = <i>(significance policy)</i>
            children:
              - type: RadioButton
                name: color_signif_1
                optionName: color_signif
                optionPart: ignore
                enable: (color)
              - type: RadioButton
                name: color_signif_2
                optionName: color_signif
                optionPart: grey_non_signif
                enable: (color)
              - type: RadioButton
                name: color_signif_3
                optionName: color_signif
                optionPart: guaranteed_effect
                enable: (color)

  - type: CollapseBox
    label: <b>Missing values and display</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: estimate_display = <i>(cell layout)</i>
            children:
              - type: RadioButton
                name: estimate_display_1
                optionName: estimate_display
                optionPart: value
              - type: RadioButton
                name: estimate_display_2
                optionName: estimate_display
                optionPart: ci
              - type: RadioButton
                name: estimate_display_3
                optionName: estimate_display
                optionPart: prob
                enable: (effect_1)
              - type: RadioButton
                name: estimate_display_4
                optionName: estimate_display
                optionPart: ame
                enable: (effect_1)
          - type: CheckBox
            name: cleannames
      - type: LayoutBox
        margin: none
        children:
          # Phase 15c: a full-width, auto-grow <textarea> (CustomControl) drives the hidden `subtext`.
          - type: Label
            label: subtext = <i>(note below the table)</i>
            children:
              - type: CustomControl
                name: subtextCtrl
                stretchFactor: 1
                events:
                  creating: ./jmvtabreg::subtextCtrl_creating
                  updated: ./jmvtabreg::subtextCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: wrap_rows
            format: number
          - type: TextBox
            name: wrap_cols
            format: number

  - type: CollapseBox
    label: "<b>Advanced — survey design (used with a weight)</b>"
    stretchFactor: 1
    collapsed: true
    children:
      - type: VariableSupplier
        name: surveysupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: <b>ids = <i>(cluster ids)</i></b>
            children:
              - type: VariablesListBox
                name: ids
                isTarget: true
          - type: TargetLayoutBox
            label: <b>strata = <i>(strata)</i></b>
            children:
              - type: VariablesListBox
                name: strata
                isTarget: true
          - type: TargetLayoutBox
            label: <b>fpc = <i>(finite population)</i></b>
            children:
              - type: VariablesListBox
                name: fpc
                maxItemCount: 1
                isTarget: true
      - type: LayoutBox
        margin: none
        children:
          - type: CheckBox
            name: nest

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      # Row of two columns: [Export button / Format below it]  |  [Save-to file name / Replace].
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: ActionButton
                name: exportExcel
                label: Export Excel
                events:
                  change: ./jmvtabreg::exportExcel_changed
              - type: Label
                label: <b>Format:</b>
                children:
                  - type: ComboBox
                    name: export_format
                    events:
                      change: ./jmvtabreg::export_format_changed
          - type: LayoutBox
            margin: none
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: <b>Save to (file name):</b>
                children:
                  - type: TextBox
                    name: export_filename
                    format: string
                    width: largest
              - type: CheckBox
                name: xl_replace
                label: Replace existing file
      # The destination folder, taking all the remaining width (stretched to 100% in js/jmvtabreg.js).
      - type: LayoutBox
        margin: none
        children:
          - type: Label
            label: <b>Folder:</b>
            children:
              - type: TextBox
                name: export_dir
                format: string
                width: largest
      # Reset the folder + file name to their defaults.
      - type: LayoutBox
        margin: none
        children:
          - type: ActionButton
            name: resetPath
            label: Reset to defaults
            events:
              change: ./jmvtabreg::resetPath_changed
