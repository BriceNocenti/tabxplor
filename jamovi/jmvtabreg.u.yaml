title: Regressions
name: jmvtabreg
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtabreg::update
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: <b>outcome = <i>(dependent variable[s])</i></b>
        children:
          - type: VariablesListBox
            name: outcome
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>predictors = <i>(explanatory variables)</i></b>
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>tab_vars = <i>(fit within each group)</i></b>
        children:
          - type: VariablesListBox
            name: tab_vars
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>wt = <i>(survey weights)</i></b>
        children:
          - type: VariablesListBox
            name: wt
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
  - type: CollapseBox
    label: <b>Models and references</b>
    stretchFactor: 1
    collapsed: false
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelTableCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelTableCtrl_creating
              updated: ./jmvtabreg::modelTableCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell:
                  column: 0
                  row: 0
                stretchFactor: 1
                children:
                  - type: Label
                    label: measure = <i>(which measure is reported)</i>
                    children:
                      - type: RadioButton
                        name: measure_1
                        optionName: measure
                        optionPart: auto
                      - type: RadioButton
                        name: measure_2
                        optionName: measure
                        optionPart: difference
                      - type: RadioButton
                        name: measure_3
                        optionName: measure
                        optionPart: ratio
                      - type: RadioButton
                        name: measure_4
                        optionName: measure
                        optionPart: odds_ratio
                      - type: RadioButton
                        name: measure_5
                        optionName: measure
                        optionPart: raw_coefficient
              - type: LayoutBox
                cell:
                  column: 1
                  row: 0
                stretchFactor: 2
                children:
                  - type: Label
                    label: color = <i>(what the color shows)</i>
                    children:
                      - type: RadioButton
                        name: color_1
                        optionName: color
                        optionPart: measure
                      - type: RadioButton
                        name: color_2
                        optionName: color
                        optionPart: adjustment
                        enable: (empirical)
                      - type: RadioButton
                        name: color_3
                        optionName: color
                        optionPart: between_groups
                      - type: RadioButton
                        name: color_4
                        optionName: color
                        optionPart: no
                      # - type: ComboBox
                      #   name: color
  # Phase 22g-iv: ONE per-variable table -- merge a factor's levels, cut a number into groups, pick
  # the baseline and the unit -- replacing the two boxes that listed the same predictors twice. The
  # same widget jmvtab shows; only its columns differ (jmvtabreg.js, VAR_TABLE_HOST).
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: "<i>Choose reference categories, merge and reorder levels, reshape numeric variables:</i>"
                margin: large
                children:
                  - type: LayoutBox
                    margin: none
                    children:
                      - type: CustomControl
                        name: varTableCtrl
                        stretchFactor: 1
                        events:
                          creating: ./jmvtabreg::varTableCtrl_creating
                          updated: ./jmvtabreg::varTableCtrl_updated
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell:
                  column: 0
                  row: 1
                stretchFactor: 1
                children:
                  - type: Label
                    label: display = <i>(what numbers the cell show)</i>
                    children:
                      - type: ComboBox
                        name: display
              - type: LayoutBox
                cell:
                  column: 1
                  row: 1
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: empirical
                    label: empirical = <i>(show the observed effect)</i>
              - type: LayoutBox
                cell:
                  column: 0
                  row: 2
                stretchFactor: 1
                children:
                  - type: Label
                    label: effect = <i>(where the numbers come from)</i>
                    children:
                      - type: ComboBox
                        name: effect
  # Phase 22g-viii: the interaction picker lost its own CollapseBox and lives at the TOP of the next
  # one, inside modelBuilderCtrl -- an interaction IS a predictor, so it is defined where a model
  # says which predictors it holds, and each card then ticks it like any other (jmvtabreg.js).
  - type: CollapseBox
    label: <b>Models comparison and interactions</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelBuilderCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelBuilderCtrl_creating
              updated: ./jmvtabreg::modelBuilderCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: na = <i>(missing values)</i>
                children:
                  - type: RadioButton
                    name: na_1
                    optionName: na
                    optionPart: drop_by_outcome
                  - type: RadioButton
                    name: na_2
                    optionName: na
                    optionPart: drop_by_model
                  - type: RadioButton
                    name: na_3
                    optionName: na
                    optionPart: drop_all
                  - type: RadioButton
                    name: na_4
                    optionName: na
                    optionPart: keep_for_predictors
      - type: LayoutBox
        margin: large
        children:
          - type: ActionButton
            name: run_compare
            label: Run comparison
            events:
              change: ./jmvtabreg::run_compare_changed
  - type: CollapseBox
    label: <b>Significance</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: conf_level
                format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: stars
                label: "<b>stars = <i>(significance stars)</i></b>"
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: Label
                label: ci_method = <i>(confidence intervals)</i>
                children:
                  - type: RadioButton
                    name: ci_method_1
                    optionName: ci_method
                    optionPart: wald
                  - type: RadioButton
                    name: ci_method_2
                    optionName: ci_method
                    optionPart: profile
      - type: LayoutBox
        margin: none
        children:
          - type: Label
            label: color_signif = <i>(significance policy)</i>
            children:
              - type: RadioButton
                name: color_signif_1
                optionName: color_signif
                optionPart: ignore
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_2
                optionName: color_signif
                optionPart: grey_non_signif
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_3
                optionName: color_signif
                optionPart: guaranteed_effect
                enable: (!(color:no))
  - type: CollapseBox
    label: <b>Other formatting</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: "theme = <i>(display and colors theme)</i>"
                fitToGrid: true
                children:
                  - type: RadioButton
                    name: tab_theme_1
                    optionName: tab_theme
                    optionPart: light
                  - type: RadioButton
                    name: tab_theme_2
                    optionName: tab_theme
                    optionPart: print_ready
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: cleannames
                label: "<b>cleannames = <i>(tidy level names)</i></b>"
          - type: LayoutBox
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: Label
                label: wrap_rows = <i>(nb chars for line break)</i>
                children:
                  - type: TextBox
                    name: wrap_rows
                    format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 1
            stretchFactor: 1
            children:
              - type: Label
                label: wrap_cols = <i>(nb chars for line break)</i>
                children:
                  - type: TextBox
                    name: wrap_cols
                    format: number
          - type: LayoutBox
            cell:
              column: 0
              row: 2
            stretchFactor: 1
            children:
              - type: Label
                label: n = <i>(counts per predictor level)</i>
                children:
                  - type: ComboBox
                    name: 'n'
          - type: LayoutBox
            cell:
              column: 1
              row: 2
            stretchFactor: 1
            children:
              - type: Label
                label: digits = <i>(number of digits)</i>
                children:
                  - type: ComboBox
                    name: digits
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: subtext = <i>(note below the table)</i>
            stretchFactor: 1
            children:
              - type: CustomControl
                name: subtextCtrl
                stretchFactor: 1
                events:
                  creating: ./jmvtabreg::subtextCtrl_creating
                  updated: ./jmvtabreg::subtextCtrl_updated
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: ActionButton
                name: exportExcel
                label: Export
                events:
                  change: ./jmvtabreg::exportExcel_changed
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: ComboBox
                name: export_format
                events:
                  change: ./jmvtabreg::export_format_changed
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: xl_check
                label: assumption checks plots
                enable: (export_format:excel)
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_dir
                format: string
                width: largest
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_filename
                format: string
                width: large
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 0
            children:
              - type: CustomControl
                name: extCtrl
                events:
                  creating: ./jmvtabreg::extCtrl_creating
                  updated: ./jmvtabreg::extCtrl_updated
      - type: LayoutBox
        margin: none
        children:
          - type: CheckBox
            name: xl_replace
            label: Replace existing file
      - type: LayoutBox
        margin: none
        children:
          - type: ActionButton
            name: resetPath
            label: Reset default path
            events:
              change: ./jmvtabreg::resetPath_changed
