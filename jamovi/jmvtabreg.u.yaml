title: Regressions
name: jmvtabreg
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./jmvtabreg::update
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: <b>outcome = <i>(dependent variable[s])</i></b>
        children:
          - type: VariablesListBox
            name: outcome
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>predictors = <i>(explanatory variables)</i></b>
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>tab_vars = <i>(fit within each group)</i></b>
        children:
          - type: VariablesListBox
            name: tab_vars
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars
      - type: TargetLayoutBox
        label: <b>wt = <i>(survey weights)</i></b>
        children:
          - type: VariablesListBox
            name: wt
            maxItemCount: 1
            isTarget: true
            events:
              change: ./jmvtabreg::onChange_vars

  - type: CollapseBox
    label: <b>Model</b>
    stretchFactor: 1
    collapsed: false
    children:
      # Per-outcome Model table: a header row (outcome | family = | link =), then one row per
      # outcome -> [name] [family] [link] [outcome_level / trials]. The 4th cell is unheaded: it
      # shows a level drop-down or a `n trials` box, which read for themselves.
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelTableCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelTableCtrl_creating
              updated:  ./jmvtabreg::modelTableCtrl_updated
      - type: LayoutBox
        margin: large
        children:
          # THE CASCADE. Its left half -- `family` (what kind of number the outcome is) and `link`
          # (which measure the MODEL estimates) -- is a question about each OUTCOME, so it lives in
          # the per-outcome table above, one headed column each. What is left here is scalar:
          # `measure` (which measure is REPORTED) then `effect` (where the number comes from).
          # "auto" everywhere means follow from the left, so an ordinary user touches nothing.
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell: { column: 0, row: 0 }
                stretchFactor: 1
                children:
                  - type: Label
                    label: measure = <i>(which measure is reported)</i>
                    children:
                      - type: RadioButton
                        name: measure_1
                        optionName: measure
                        optionPart: auto
                      - type: RadioButton
                        name: measure_2
                        optionName: measure
                        optionPart: difference
                      - type: RadioButton
                        name: measure_3
                        optionName: measure
                        optionPart: ratio
                      - type: RadioButton
                        name: measure_4
                        optionName: measure
                        optionPart: odds_ratio
                      - type: RadioButton
                        name: measure_5
                        optionName: measure
                        optionPart: coefficient
              - type: LayoutBox
                cell: { column: 1, row: 0 }
                stretchFactor: 1
                children:
                  - type: Label
                    label: effect = <i>(where the numbers come from)</i>
                    children:
                      - type: RadioButton
                        name: effect_1
                        optionName: effect
                        optionPart: auto
                      - type: RadioButton
                        name: effect_2
                        optionName: effect
                        optionPart: conditional
                      - type: RadioButton
                        name: effect_3
                        optionName: effect
                        optionPart: marginal
                      - type: RadioButton
                        name: effect_4
                        optionName: effect
                        optionPart: at_reference
          # `display` and `empirical` share the cascade's two columns above, so the box reads as one
          # grid: what the cell shows, and whether the observed effect stands beside it.
          - type: LayoutBox
            margin: none
            children:
              - type: LayoutBox
                cell: { column: 0, row: 0 }
                stretchFactor: 1
                children:
                  - type: Label
                    label: display = <i>(cell layout)</i>
                    children:
                      - type: ComboBox
                        name: display
              - type: LayoutBox
                cell: { column: 1, row: 0 }
                stretchFactor: 1
                children:
                  - type: CheckBox
                    name: empirical
                    label: empirical = <i>(show the observed effect)</i>
              # `color` comes last because its main use -- "adjustment" -- is a statement ABOUT the
              # observed effect above it.
              - type: LayoutBox
                cell: { column: 0, row: 1 }
                stretchFactor: 1
                children:
                  - type: Label
                    label: color = <i>(what the colours measure)</i>
                    children:
                      - type: ComboBox
                        name: color

  - type: CollapseBox
    label: <b>Interactions</b>
    stretchFactor: 1
    collapsed: true
    children:
      # An interaction is a PREDICTOR whose levels are combinations, so it is written INTO
      # `predictors` as `a*b` -- there is no second argument. This picker fills the hidden
      # `crosses` array, which jmvtab_reg_cross_keys() folds into that one argument.
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: crossPickerCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::crossPickerCtrl_creating
              updated:  ./jmvtabreg::crossPickerCtrl_updated

  - type: CollapseBox
    label: <b>Model comparison (+ predictor subsets)</b>
    stretchFactor: 1
    collapsed: true
    children:
      # The model-builder "+" cards first, then the comparison test, then how missing values are dropped.
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: modelBuilderCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::modelBuilderCtrl_creating
              updated:  ./jmvtabreg::modelBuilderCtrl_updated
      # `stats =` has no control any more: the comparison test is tab_reg()'s own default with two
      # or more subsets (22g-ii). What is left to ask is how missing values are dropped, which is
      # what decides whether the models share a population and can be tested at all.
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: na = <i>(missing values)</i>
                children:
                  - type: RadioButton
                    name: na_1
                    optionName: na
                    optionPart: drop_by_outcome
                  - type: RadioButton
                    name: na_2
                    optionName: na
                    optionPart: drop_by_model
                  - type: RadioButton
                    name: na_3
                    optionName: na
                    optionPart: drop_all
      # Phase h: with >=2 models the table computes only on this click (no live refit while picking).
      - type: LayoutBox
        margin: large
        children:
          - type: ActionButton
            name: run_compare
            label: Run comparison
            events:
              change: ./jmvtabreg::run_compare_changed

  # The two questions a predictor raises were one box; they are the SAME TWO BOXES jmvtab has now,
  # driven by the same widgets. ⚠ One deliberate difference: the level list here has no reorder bar,
  # because tab_reg() has no `levels_order` argument -- a move would write nowhere.
  - type: CollapseBox
    label: <b>Reorder, merge and cut levels</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: levelsCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::levelsCtrl_creating
              updated: ./jmvtabreg::levelsCtrl_updated

  - type: CollapseBox
    label: <b>References (points of comparison)</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: none
        children:
          - type: CustomControl
            name: refPickerCtrl
            stretchFactor: 1
            events:
              creating: ./jmvtabreg::refPickerCtrl_creating
              updated: ./jmvtabreg::refPickerCtrl_updated

  - type: CollapseBox
    label: <b>Significance</b>
    stretchFactor: 1
    collapsed: true
    children:
      # `color` moved to the Model box (its main use, "adjustment", is a statement about the
      # observed effect declared there). Two equal columns, as in jmvtab's own interval box.
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: "conf_level = <i>(confidence level)</i>"
                children:
                  - type: TextBox
                    name: conf_level
                    format: number
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: CheckBox
                name: stars
                label: stars = <i>(significance stars)</i>
          - type: LayoutBox
            cell: { column: 0, row: 1 }
            stretchFactor: 1
            children:
              - type: Label
                label: ci_method = <i>(conf. interval)</i>
                children:
                  - type: RadioButton
                    name: ci_method_1
                    optionName: ci_method
                    optionPart: wald
                  - type: RadioButton
                    name: ci_method_2
                    optionName: ci_method
                    optionPart: profile
      # Row 3: the significance policy across the full width (greyed out when colours are off).
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: color_signif = <i>(significance policy)</i>
            children:
              - type: RadioButton
                name: color_signif_1
                optionName: color_signif
                optionPart: ignore
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_2
                optionName: color_signif
                optionPart: grey_non_signif
                enable: (!(color:no))
              - type: RadioButton
                name: color_signif_3
                optionName: color_signif
                optionPart: guaranteed_effect
                enable: (!(color:no))

  # The same two-column grid as jmvtab's own "Other formatting" box, and in the same order: the
  # whole-table look, then the wrapping, then the labels. `display` and `color` left for the Model
  # box, where the questions they answer are asked.
  - type: CollapseBox
    label: <b>Other formatting</b>
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: Label
                label: theme = <i>(colours, or black and white)</i>
                fitToGrid: true
                children:
                  - type: RadioButton
                    name: theme_1
                    optionName: theme
                    optionPart: light
                  - type: RadioButton
                    name: theme_2
                    optionName: theme
                    optionPart: print_ready
          - type: LayoutBox
            cell: { column: 0, row: 1 }
            stretchFactor: 1
            children:
              - type: Label
                label: "wrap_rows = <i>(nb chars for line break)</i>"
                children:
                  - type: TextBox
                    name: wrap_rows
                    format: number
          - type: LayoutBox
            cell: { column: 1, row: 1 }
            stretchFactor: 1
            children:
              - type: Label
                label: "wrap_cols = <i>(nb chars for line break)</i>"
                children:
                  - type: TextBox
                    name: wrap_cols
                    format: number
          - type: LayoutBox
            cell: { column: 0, row: 2 }
            stretchFactor: 1
            children:
              - type: Label
                label: n = <i>(N per predictor level)</i>
                children:
                  - type: ComboBox
                    name: "n"
          - type: LayoutBox
            cell: { column: 1, row: 2 }
            stretchFactor: 1
            children:
              - type: CheckBox
                name: cleannames
                label: cleannames = <i>(tidy level names)</i>
      # Phase 15c / h: the below-table note is a full-width, auto-grow <textarea> (CustomControl driving
      # the hidden `subtext`). stretchFactor on the row so the box fills the width to its right.
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: subtext = <i>(note below the table)</i>
            stretchFactor: 1
            children:
              - type: CustomControl
                name: subtextCtrl
                stretchFactor: 1
                events:
                  creating: ./jmvtabreg::subtextCtrl_creating
                  updated: ./jmvtabreg::subtextCtrl_updated

  # Phase o: the rule that sets the (outside-the-collapse-hierarchy) Export block apart is drawn by
  # js/jmvtab.js styleExportSep() (a border-top on this block) -- a former <hr> Label showed as raw text.
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      # Row 1: the Export action, the Format selector, the Replace-existing toggle.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: ActionButton
                name: exportExcel
                label: Export
                events:
                  change: ./jmvtabreg::exportExcel_changed
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: ComboBox
                name: export_format
                events:
                  change: ./jmvtabreg::export_format_changed
          # Excel only: reg_check_plots() drawn under each table (tab_xl(check = "auto")).
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: xl_check
                label: assumption checks plots
                enable: (export_format:excel)
      # Row 2: ONE full-width path line -- "Path:" <folder> " / " <filename> <.ext>.
      #   folder : filename width = 3 : 2. This ratio only holds because js injectExportCss() collapses
      #   the TextBoxes' ~200px max-content floor -- otherwise both cells bottom out at 200px (see the js).
      #   The label / separator / extension cells are stretch 0, so they take only their text width.
      - type: LayoutBox
        margin: none
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_dir
                format: string
                width: largest
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 0
            children:
              - type: TextBox
                name: export_filename
                format: string
                width: large
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 0
            children:
              - type: CustomControl
                name: extCtrl
                events:
                  creating: ./jmvtabreg::extCtrl_creating
                  updated: ./jmvtabreg::extCtrl_updated
      # Row 3: the overwrite rule.
      - type: LayoutBox
        margin: none
        children:
          - type: CheckBox
            name: xl_replace
            label: Replace existing file
       # Row 4: a discreet, right-aligned "default path" reset.
      - type: LayoutBox
        margin: none
        children:
          - type: ActionButton
            name: resetPath
            label: Reset default path
            events:
              change: ./jmvtabreg::resetPath_changed


