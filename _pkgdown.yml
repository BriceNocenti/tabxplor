url: https://bricenocenti.github.io/tabxplor/

template:
  bootstrap: 5

# Last Phase w: language switcher -> the French site built from _pkgdown.fr.yml into docs/fr/.
navbar:
  structure:
    right: [lang, search, github]
  components:
    lang:
      text: FR
      href: fr/index.html

# The reference is ordered by priority: the two headline functions first, then everything an ordinary
# user needs, then (clearly separated) the functions for programming with tabxplor. The S3 methods and
# internal helpers carry `@keywords internal`, so pkgdown drops them from the index entirely -- users
# call the generics (`get_type()`, `mutate()`, …), never the dotted methods.
reference:

# ===================================  Everyday use  ===================================

- title: The two main functions
  desc: >
    Start here. `tab()` builds a colour-coded cross-table; `tab_reg()` a regression table that
    looks and behaves like one.
  contents:
  - tab
  - tab_reg

- title: Variants of tab()
  desc: The same idea as `tab()`, for a particular input.
  contents:
  - tab_num
  - tab_counts

- title: Regression shortcuts and plots
  desc: >
    `tab_logit()` and `multi_logit()` are thin wrappers around `tab_reg()` for logistic models.
    `or_plot()` and `lm_plots()` draw plots from a finished regression table.
  contents:
  - tab_logit
  - multi_logit
  - or_plot
  - lm_plots

- title: Export a finished table
  desc: >
    `tab_export()` is the one function most users need. `tab_html()`, `tab_md()`, `tab_xl()` and
    `tab_plot()` are the per-format exporters it wraps (`tab_kable()` is an alias of `tab_html()`);
    `tab_css()` / `tab_md_css()` emit the colour stylesheet for a whole document.
  contents:
  - tab_export
  - tab_html
  - tab_md
  - tab_xl
  - tab_plot
  - tab_css
  - tab_md_css

- title: Captions, options and data
  desc: >
    Colour scales and palettes are customised with `set_color_breaks()`, `set_color_palette()` and
    `set_color_style()` (documented on the `tab_many()` page).
  contents:
  - set_caption
  - tabxplor-options
  - gss_cat_data_formatting

- title: Point-and-click interface (jamovi)
  contents:
  - jmvtab
  - jmvtabreg

# ==============================  Programming with tabxplor  ==============================
# For writing your own helpers and pipelines. Everyday use never needs the functions below.

- title: The engine, reshaping and combining
  desc: >
    `tab_many()` is the vectorised engine behind `tab()` (and the home of the colour helpers
    `set_color_breaks()` / `set_color_palette()` / `set_color_style()`). The rest reshape and
    combine finished tables.
  contents:
  - tab_many
  - tab_spread
  - tab_compact
  - tab_transpose
  - complete_partial_totals

- title: The fmt cell type
  desc: The `tabxplor_fmt` vctrs record behind every numeric cell, and its constructors.
  contents:
  - fmt
  - new_tab
  - fmt_get_color_code

- title: The step-by-step pipeline (superseded)
  desc: >
    The individual steps `tab_many()` now fuses into one. Each is still exported and usable on its
    own, but `tab()` / `tab_num()` supersede them.
  contents:
  - tab_plain
  - tab_prepare
  - tab_pct
  - tab_tot
  - tab_totaltab
  - tab_ci
  - tab_chi2

- title: Data-prep and text helpers
  desc: Small utilities for preparing data or laying out a table.
  contents:
  - score_from_lv1
  - fct_recode_helper
  - tab_wrap_text
  - tab_get_wrapped_dimensions
  - tab_parallel_stop
  - kable_tabxplor_style

# pkgdown builds every article under vignettes/ into BOTH site trees, and an incomplete `articles:`
# index is a hard error, so all six are listed here. The French translations (vignettes/articles/*-fr)
# lead the French site (_pkgdown.fr.yml) and sit in a secondary "En français" group here.
articles:
- title: Get started
  navbar: ~
  contents:
  - tabxplor
  - tabxplor-reg
  - tabxplor-programming
- title: En français
  navbar: Français
  contents:
  - articles/tabxplor-fr
  - articles/tabxplor-reg-fr
  - articles/tabxplor-programming-fr
