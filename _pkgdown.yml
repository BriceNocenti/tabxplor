url: https://bricenocenti.github.io/tabxplor/

# `light-switch` puts a Light/Dark/Auto control in the navbar, applied as bootstrap 5.3 colour modes
# (`data-bs-theme` on <html>) -- which is one of the hooks tab_css(theme = "auto") already writes its
# cascade against (tx_dark_hooks, R/tab-css.R), so the tables follow the reader like the page does.
# The vignettes emit "auto" only under pkgdown; a CRAN-shipped vignette is read on a light page.
template:
  bootstrap: 5
  light-switch: true

home:
  links:
  - text: Use it without code, in jamovi
    href: https://www.jamovi.org/download.html

# One English site. The French translations of the vignettes live in Articles ("En français") --
# no second FR site build, no language toggle. `intro` is dropped from the left side so the
# introduction vignette appears in Articles like every other one (symmetric with the French set),
# instead of a separate "Get started" page.
# The `articles` menu is EXPLICIT because pkgdown special-cases the package-named vignette
# (vignettes/tabxplor.Rmd) as the "Get started" intro and silently drops it from the auto-built
# Articles menu -- with `intro` removed from the navbar it would appear nowhere.
navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Introduction to tabxplor
        href: articles/tabxplor.html
      - text: "All else equal: reading a regression without losing the data"
        href: articles/tabxplor-all-else-equal.html
      - text: Regression tables with tab_reg()
        href: articles/tabxplor-reg.html
      - text: Weighted and survey data
        href: articles/tabxplor-weights.html
      - text: Programming with tabxplor
        href: articles/tabxplor-programming.html
      - text: -------
      - text: En français
      - text: Introduction à tabxplor
        href: articles/tabxplor-fr.html
      - text: "Toutes choses égales par ailleurs : lire une régression sans lâcher les pourcentages"
        href: articles/tabxplor-all-else-equal-fr.html
      - text: Tableaux de régression avec tab_reg()
        href: articles/tabxplor-reg-fr.html
      - text: Données pondérées et plans de sondage
        href: articles/tabxplor-weights-fr.html
      - text: Programmer avec tabxplor
        href: articles/tabxplor-programming-fr.html

# The reference is ordered by priority: the two headline functions first, then everything an ordinary
# user needs, then (clearly separated) the functions for programming with tabxplor. The S3 methods and
# internal helpers carry `@keywords internal`, so pkgdown drops them from the index entirely -- users
# call the generics (`get_scale()`, `mutate()`, …), never the dotted methods.
reference:

# ===================================  Everyday use  ===================================

- title: The two main functions
  desc: >
    Start here. `tab()` builds a colour-coded cross-table; `tab_reg()` a regression table that
    looks and behaves like one.
  contents:
  - tab
  - tab_reg

- title: Variants of tab()
  desc: >
    The same idea as `tab()`, for a particular input: `tab_num()` for numeric variables,
    `tab_counts()` for data that is already counted.
  contents:
  - tab_num
  - tab_counts

- title: What a cell shows, and how it is coloured
  desc: >
    `tabxplor-display` is the vocabulary of the `display` argument: the fields a cell may show and
    the named layouts that arrange them. Then, what a coloured cell looks like and at which value it
    changes shade: `set_color_palette()` sets the hues and the console's light/dark theme,
    `set_color_breaks()` the thresholds each measure is read on, and `conf_level_to_z()` writes one
    of those thresholds as a confidence level.
  contents:
  - tabxplor-display
  - set_color_palette
  - conf_level_to_z

- title: Export a finished table
  desc: >
    `tab_export()` is the one function most users need. `tab_html()`, `tab_md()` and `tab_xl()`
    are the per-format exporters it wraps (`tab_kable()` is an alias of `tab_html()`);
    `tab_css()` emits the colour stylesheet for a whole document.
  contents:
  - tab_export
  - tab_html
  - tab_md
  - tab_xl
  - tab_css

- title: Charts
  desc: >
    `forest_plot()` draws the estimates of any tabxplor table -- a cross-table or a regression --
    with their intervals, their significance and their colours, reading the finished table and
    never re-fitting. `reg_check_plots()` draws the model checks, which always do.
  contents:
  - forest_plot
  - reg_check_plots

- title: What a model can be, and what it fitted
  desc: >
    `reg_measures()` lists which effect x measure combinations `tab_reg()` can build for a given
    outcome, and why the others are refused. `reg_formulas()` shows the formula behind every column
    of a finished table -- exactly what reached the fitter.
  contents:
  - reg_measures
  - reg_formulas

- title: Captions and options
  desc: >
    A caption travels with the table into every export; every default lives in a `tabxplor.*` option.
  contents:
  - set_caption
  - tabxplor-options

- title: Example data
  desc: >
    The data behind the examples and the vignettes. `gss_cat_data_formatting()` returns the US
    survey extract most examples use; the four data sets are complete copies of data published
    elsewhere, each named after the package it comes from and credited on its own page.
  contents:
  - gss_cat_data_formatting
  - facto_tea
  - questionr_hdv
  - car_arrests
  - car_salaries

- title: Point-and-click interface (jamovi)
  desc: >
    Everything tabxplor does, without writing R code. Install the free open-source
    [jamovi](https://www.jamovi.org/download.html), open the modules menu (the `+` at the
    top-right), choose *jamovi library*, and install **tabxplor**: it adds a *Crosstables*
    and a *Regressions* analysis, driven entirely by menus.
  contents:
  - jmvtab
  - jmvtabreg

# ==============================  Programming with tabxplor  ==============================
# For writing your own helpers and pipelines. Everyday use never needs the functions below.

- title: Reshaping and combining
  desc: >
    Reshape and combine finished tables: pivot a sub-table variable into columns, merge several
    tables into one, swap rows and columns.
  contents:
  - tab_spread
  - tab_compact
  - tab_transpose

- title: Inspect a table
  desc: >
    What have I got, and what can I do with it? `tab_structure()` reports the structure (merged,
    grouped, a list) -- with the variables on each axis -- and `tab_supports()` which operations
    accept it; `tab_columns()` lists every numeric column with what it estimates, how it is
    coloured and how its interval was computed; `is_tab()` tests the class.
  contents:
  - tab_structure
  - tab_supports
  - tab_columns
  - is_tab

- title: The fmt cell type
  desc: >
    The `tabxplor_fmt` vctrs record behind every numeric cell. A **field** varies from cell to cell,
    an **attribute** holds for a whole column: `fmt()` builds the record, `fmt_fields` and
    `fmt_attributes` document the accessors of each kind, and `fmt_attr()` reaches any attribute by
    name. `new_tab()` builds the table around them.
  contents:
  - fmt
  - fmt_fields
  - fmt_attributes
  - fmt_attr
  - new_tab
  - fmt_get_color_code

- title: Superseded entry points
  desc: >
    Both still work and give the same numbers, but `tab()` has absorbed them: `tab_many()` is now a
    thin shim over it, and `tab_plain()` builds one bare cross-table from a single pair of
    variables. The step-by-step chain they used to be piped into (`tab_pct()`, `tab_tot()`,
    `tab_ci()`, `tab_chi2()`, ...) is deprecated -- the build fuses it into one pass.
  contents:
  - tab_many
  - tab_plain

- title: Data-prep and text helpers
  desc: Small utilities for preparing data or laying out a table.
  contents:
  - score_from_lv1
  - shape_numeric_var
  - tab_wrap_text
  - tab_parallel_stop

# An incomplete `articles:` index is a hard pkgdown error, so all nine articles are listed here.
# The French translations (vignettes/articles/*-fr) sit in the secondary "En français" group.
articles:
- title: Start here
  navbar: ~
  desc: >
    The introduction builds a first coloured table; *All else equal* walks one analysis from that
    table to a finished sentence about a regression.
  contents:
  - tabxplor
  - tabxplor-all-else-equal
- title: Going further
  navbar: ~
  desc: >
    Look up what a regression table can be asked, what a weighted or survey file changes, and how to
    write your own pipelines around the `fmt` cell.
  contents:
  - tabxplor-reg
  - tabxplor-weights
  - tabxplor-programming
- title: En français
  navbar: Français
  desc: >
    Les traductions françaises des articles (les pages de référence restent en anglais).
  contents:
  - articles/tabxplor-fr
  - articles/tabxplor-all-else-equal-fr
  - articles/tabxplor-reg-fr
  - articles/tabxplor-weights-fr
  - articles/tabxplor-programming-fr
