url: https://bricenocenti.github.io/tabxplor/

template:
  bootstrap: 5

# One English site. The French translations of the vignettes live in Articles ("En français") --
# no second FR site build, no language toggle. `intro` is dropped from the left side so the
# introduction vignette appears in Articles like every other one (symmetric with the French set),
# instead of a separate "Get started" page.
# The `articles` menu is EXPLICIT because pkgdown special-cases the package-named vignette
# (vignettes/tabxplor.Rmd) as the "Get started" intro and silently drops it from the auto-built
# Articles menu -- with `intro` removed from the navbar it would appear nowhere.
navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Introduction to tabxplor
        href: articles/tabxplor.html
      - text: Regression tables with tab_reg()
        href: articles/tabxplor-reg.html
      - text: "All else equal: reading a regression without losing the data"
        href: articles/tabxplor-all-else-equal.html
      - text: Programming with tabxplor
        href: articles/tabxplor-programming.html
      - text: -------
      - text: En français
      - text: Introduction à tabxplor
        href: articles/tabxplor-fr.html
      - text: Tableaux de régression avec tab_reg()
        href: articles/tabxplor-reg-fr.html
      - text: Toutes choses égales par ailleurs
        href: articles/tabxplor-all-else-equal-fr.html
      - text: Programmer avec tabxplor
        href: articles/tabxplor-programming-fr.html

# The reference is ordered by priority: the two headline functions first, then everything an ordinary
# user needs, then (clearly separated) the functions for programming with tabxplor. The S3 methods and
# internal helpers carry `@keywords internal`, so pkgdown drops them from the index entirely -- users
# call the generics (`get_scale()`, `mutate()`, …), never the dotted methods.
reference:

# ===================================  Everyday use  ===================================

- title: The two main functions
  desc: >
    Start here. `tab()` builds a colour-coded cross-table; `tab_reg()` a regression table that
    looks and behaves like one.
  contents:
  - tab
  - tab_reg

- title: Variants of tab()
  desc: >
    The same idea as `tab()`, for a particular input: `tab_num()` for numeric variables,
    `tab_counts()` for pre-aggregated counts, `tab_plain()` for a single bare cross-table.
  contents:
  - tab_num
  - tab_counts
  - tab_plain

- title: Charts
  desc: >
    `forest_plot()` draws the estimates of any tabxplor table -- a cross-table or a regression --
    with their intervals, their significance and their colours, reading the finished table and
    never re-fitting. `reg_check_plots()` draws the model checks, which always do.
  contents:
  - forest_plot
  - reg_check_plots

- title: What can this outcome be modelled as?
  desc: >
    `reg_measures()` lists which effect x measure combinations `tab_reg()` can build for a given
    outcome, and why the others are refused.
  contents:
  - reg_measures

- title: Export a finished table
  desc: >
    `tab_export()` is the one function most users need. `tab_html()`, `tab_md()`, `tab_xl()` and
    `tab_plot()` are the per-format exporters it wraps (`tab_kable()` is an alias of `tab_html()`);
    `tab_css()` emits the colour stylesheet for a whole document.
  contents:
  - tab_export
  - tab_html
  - tab_md
  - tab_xl
  - tab_plot
  - tab_css

- title: Colours
  desc: >
    What a coloured cell looks like, and at which value it changes shade. `set_color_palette()` sets
    the hues and the console's light/dark theme; `set_color_breaks()` sets the thresholds each
    measure is read on; `conf_level_to_z()` writes one of those thresholds as a confidence level.
  contents:
  - set_color_palette
  - set_color_breaks
  - conf_level_to_z

- title: Captions, options and data
  desc: >
    A caption travels with the table into every export; every default lives in a `tabxplor.*` option.
  contents:
  - set_caption
  - tabxplor-options
  - gss_cat_data_formatting

- title: Point-and-click interface (jamovi)
  desc: >
    Everything tabxplor does, without writing R code. Install the free open-source
    [jamovi](https://www.jamovi.org/download.html), open the modules menu (the `+` at the
    top-right), choose *jamovi library*, and install **tabxplor**: it adds a *Crosstables*
    and a *Regressions* analysis, driven entirely by menus.
  contents:
  - jmvtab
  - jmvtabreg

# ==============================  Programming with tabxplor  ==============================
# For writing your own helpers and pipelines. Everyday use never needs the functions below.

- title: Reshaping and combining
  desc: >
    Reshape and combine finished tables: pivot a sub-table variable into columns, merge several
    tables into one, swap rows and columns.
  contents:
  - tab_spread
  - tab_compact
  - tab_transpose

- title: Inspect a table
  desc: >
    What have I got, and what can I do with it? `tab_structure()` reports the structure (merged, grouped, a
    list) and `tab_supports()` which operations accept it; `tab_columns()` lists every numeric
    column with what it estimates, how it is coloured and how its interval was computed;
    `tab_get_vars()` names the variables and `is_tab()` tests the class. `fmt_attr()` reads or
    writes one column attribute by name.
  contents:
  - tab_structure
  - tab_supports
  - tab_columns
  - tab_get_vars
  - is_tab
  - fmt_attr

- title: The fmt cell type
  desc: The `tabxplor_fmt` vctrs record behind every numeric cell, and its constructors.
  contents:
  - fmt
  - new_tab
  - fmt_get_color_code

- title: Superseded entry points and steps
  desc: >
    `tab_many()` is now a thin shim over `tab()`, which absorbed it. The individual steps below are
    what the build fuses into one pass; each is still exported and works on an existing table, but
    `tab()` / `tab_num()` supersede them.
  contents:
  - tab_many
  - tab_pct
  - tab_tot
  - tab_totaltab
  - tab_ci
  - tab_chi2

- title: Data-prep and text helpers
  desc: Small utilities for preparing data or laying out a table.
  contents:
  - score_from_lv1
  - tab_wrap_text
  - tab_parallel_stop

# An incomplete `articles:` index is a hard pkgdown error, so all eight articles are listed here.
# The French translations (vignettes/articles/*-fr) sit in the secondary "En français" group.
articles:
- title: Get started
  navbar: ~
  contents:
  - tabxplor
  - tabxplor-reg
  - articles/tabxplor-all-else-equal
  - tabxplor-programming
- title: En français
  navbar: Français
  contents:
  - articles/tabxplor-fr
  - articles/tabxplor-reg-fr
  - articles/tabxplor-all-else-equal-fr
  - articles/tabxplor-programming-fr
